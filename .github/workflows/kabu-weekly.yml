# 週に一度、銘柄マスタと決算を更新する。設計書 §1・§8.1・§8.2。
# 決算の更新が遅れても困らない（素体は前回のまま）ので、失敗しても日次は止めない。
name: kabu-weekly

on:
  schedule:
    # 日曜 06:00 JST = 土曜 21:00 UTC
    - cron: "0 21 * * 6"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kabu-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    # 手元の実測（約 3,535 銘柄）: 銘柄マスタ 1 分・決算 80 秒（同時 6 本）・
    # 状態の焼き直し 50 秒・検証 20 秒 ＝ 4 分ほど。外部 API の遅い日を見て余裕を取る。
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # JPX の月次一覧から社名・33 業種・上場状態を取り込む。
      # 日経 225 の構成銘柄ページに届けば indices に nk225 が入る（届かなければ据え置き）。
      - name: 銘柄マスタを更新
        run: node scripts/kabu/build-universe.mjs

      - name: 決算を更新
        run: node scripts/kabu/fetch-fin.mjs

      # 決算が入ると EPS/BPS/発行済株式数が使えるようになるので、PER・PBR・時価総額を焼き直す
      - name: 状態を焼き直す
        run: node scripts/kabu/fetch-prices.mjs

      - name: 検証（ここで落ちたらコミットしない）
        run: node scripts/kabu/validate.mjs

      - name: コミット
        run: |
          if git diff --quiet -- kabu; then
            echo "変更なし"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kabu
          git commit -m "データ: 銘柄マスタと決算を更新（$(date -u +%Y-%m-%d)）"
          git push
