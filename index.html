  h.push('<div id="fin-slot"></div>');

  // 契約
  var hd = store.holdings[code];
  h.push('<h3 style="margin-top:14px">契約</h3>');
  if (hd) {
    var pl = (num(st.close) - hd.cost) * hd.units;
    h.push('<div class="row small"><span>' + units(hd.units) + ' 口</span><span>取得単価 ' + yen(hd.cost) + ' 円</span>' +
      '<span class="' + cls(pl) + '">評価損益 ' + (pl >= 0 ? "+" : "") + yen(pl) + ' 円</span></div>');
  } else h.push('<div class="muted small">契約していません。</div>');
  h.push('<div class="row" style="margin-top:8px">' +
    (u.listed === false ? '<span class="muted small">上場廃止のため契約できません。</span>' :
      '<button class="sm" data-buy="' + code + '" ' + (store.cash < num(st.close) ? "disabled" : "") + '>契約する（' + yen(st.close) + ' 円）</button>') +
    (hd ? ' <button class="sm" data-sell="' + code + '">1 口手放す</button>' : "") +
    ' <button class="sm" data-close="1">閉じる</button></div>');

  openDialog(h.join(""));

  loadFin(code).then(function (f) {
    if (dlgCode !== code) return;              // 別の銘柄に移っていたら書き込まない
    var slot = $("fin-slot");
    if (slot) slot.innerHTML = f ? finHtml(f) : "";
  });
}

function finHtml(f) {
  return '<h3 style="margin-top:14px">決算（直近 4 四半期）</h3><div class="row small">' +
    '<span>売上 ' + (num(f.sales) / 1e12).toFixed(2) + ' 兆</span>' +
    '<span>' + (f.opIsPretax ? "経常" : "営業") + '利益 ' + (num(f.op) / 1e8).toFixed(0) + ' 億（利益率 ' +
    (num(f.sales) > 0 ? (num(f.op) / num(f.sales) * 100).toFixed(1) : "—") + '%）</span>' +
    '<span>自己資本比率 ' + (num(f.eqRatio) * 100).toFixed(0) + '%</span>' +
    '<span>売上成長 ' + pct(f.salesGrowth, 1) + '</span>' +
    '<span>配当 ' + yen(f.div) + ' 円</span>' +
    (f.fiscalId ? '<span class="faint">' + esc(f.fiscalId) + '</span>' : "") + '</div>';
}

function openDialog(html) {
  $("dlg-body").innerHTML = html;
  var d = $("dlg");
  if (!d.open) d.showModal();
}

// ══════════════ 上場廃止（設計書 §8.4）══════════════
// listed:false になった銘柄は、契約中なら最終終値で自動的に手放して資金に戻し、
// 図鑑の「旅立ち」に記録を残す。黙って消さないよう、起こったことは必ず画面に出す。
function processDelistings() {
  var notes = [];
  Object.keys(store.holdings).forEach(function (code) {
    var u = stockOf(code);
    if (!u || u.listed !== false) return;
    var hd = store.holdings[code], st = stateOf(code);
    var price = st ? num(st.close) : num(hd.last, hd.cost);
    var proceeds = Math.round(price * num(hd.units));
    store.cash += proceeds;
    store.delisted.unshift({
      code: code, name: String(u.name || code), short: String(u.short || u.name || code),
      elem: elemOfCode(code), date: String(u.delistedAt || D.latest.date),
      units: num(hd.units), price: price, proceeds: proceeds,
      pl: Math.round((price - num(hd.cost)) * num(hd.units))
    });
    store.delisted = store.delisted.slice(0, 200);
    delete store.holdings[code];
    var i = store.party.indexOf(code);
    if (i >= 0) store.party[i] = "";
    notes.push({
      kind: "delist",
      text: "「" + (u.short || u.name) + "」が上場廃止になりました。最終終値 " + yen(price) + " 円で " +
        units(hd.units) + " 口ぶんを手放し、" + yen(proceeds) + " 円が資金に戻りました。図鑑の「旅立ち」に記録が残ります。"
    });
  });
  // 契約していないのにパーティへ残っている廃止銘柄も外す
  for (var i = 0; i < 3; i++) {
    var pc = store.party[i];
    if (!pc) continue;
    var pu = stockOf(pc);
    if (pu && pu.listed === false) {
      store.party[i] = "";
      notes.push({ kind: "delist", text: "「" + (pu.short || pu.name) + "」はもう上場していないので、パーティから外しました。" });
    }
  }
  return notes;
}

/** 契約中の銘柄の「最後に見た終値」を覚えておく（上場廃止で latest から消えたときの拠りどころ） */
function touchLast() {
  Object.keys(store.holdings).forEach(function (c) {
    var st = stateOf(c);
    if (st && isFinite(num(st.close, NaN))) store.holdings[c].last = num(st.close);
  });
}

// ══════════════ 株式分割・併合（設計書 §8.3）══════════════
// その日に分割・併合があった銘柄を契約中なら口数と取得単価を調整する（資金価値は保存される）。
// 計算は KB.adjustHolding に任せる（自分で比を掛け直さない）。
function applySplits(day, notes) {
  var evs = Object.create(null);
  (Array.isArray(day.splits) ? day.splits : []).forEach(function (sp) {
    if (!sp || sp.code == null) return;
    if (sp.date && String(sp.date) !== String(day.date)) return;   // 別の日の出来事は蒸し返さない
    evs[String(sp.code)] = sp;
  });
  // 銘柄の状態側に split（比率）だけ入っている形にも対応する
  Object.keys(store.holdings).forEach(function (code) {
    if (evs[code]) return;
    var st = stateOf(code, day), r = st ? num(st.split) : 0;
    if (r > 0 && r !== 1) evs[code] = { code: code, ratio: r };
  });

  Object.keys(evs).forEach(function (code) {
    var hd = store.holdings[code];
    if (!hd) return;
    var sp = evs[code];
    // 分割か併合かは numerator と denominator で決める（比の数値だけで較べると浮動小数で揺れます）。
    // 5:1 分割なら numerator=5・denominator=1 → n=5。1:2 併合なら numerator=1・denominator=2 → n=2。
    var nu = num(sp.numerator), de = num(sp.denominator), ev = null;
    if (nu > 0 && de > 0 && nu !== de) {
      ev = nu > de ? { kind: "split", n: nu / de } : { kind: "merge", n: de / nu };
    } else {
      var ratio = num(sp.ratio);   // numerator/denominator が無い形（銘柄側の split）への予備
      if (!(ratio > 0) || ratio === 1) return;
      ev = ratio > 1 ? { kind: "split", n: ratio } : { kind: "merge", n: 1 / ratio };
    }
    // 1:4,400,000 のような明らかにおかしい比が混じることがあるので、常識の範囲だけ受け付ける
    if (!(ev.n > 1.001) || ev.n > 100) {
      notes.push({
        kind: "split",
        text: "「" + (stockOf(code) ? (stockOf(code).short || stockOf(code).name) : code) +
          "」の分割・併合の比（" + num(sp.numerator) + ":" + num(sp.denominator) +
          "）が常識の範囲を外れていたので、口数はそのままにしました。"
      });
      return;
    }
    var before = { units: num(hd.units), cost: num(hd.cost) };
    var after = KB.adjustHolding(before, ev);
    hd.units = after.units; hd.cost = after.cost;
    var u = stockOf(code);
    var nText = units(ev.n);
    notes.push({
      kind: "split",
      text: "「" + (u ? (u.short || u.name) : code) + "」に" +
        (ev.kind === "split" ? "株式分割（1 株 → " + nText + " 株）" : "株式併合（" + nText + " 株 → 1 株）") +
        "がありました。" + units(before.units) + " 口 → " + units(after.units) + " 口、" +
        "取得単価 " + yen(before.cost) + " → " + yen(after.cost) + " 円（資金の価値は変わりません）。"
    });
  });
}

// ══════════════ 精算（設計書 §7.1）══════════════
// 開いた時に未処理の営業日をまとめて処理する。日ごとの結果は hash(date) だけで決まるので
// 順序に依らず、開かなかった日も後から同じ結果で再現できる。
function settleAll() {
  var days = pendingDays();
  if (!days.length) return;
  if (partyReady() < 3) {
    openDialog('<h2>パーティが揃っていません</h2><div class="muted">3 体そろえてから精算してください。' +
      '「市場」で契約して、「編成」で並べます。</div><div class="row" style="margin-top:12px"><button data-tab="market">市場へ</button><button data-close="1">閉じる</button></div>');
    return;
  }
  var btn = $("btn-settle");
  if (btn) { btn.disabled = true; btn.textContent = "精算しています…"; }

  loadDays(days).then(function () {
    var out = [], notes = [], skipped = 0;
    days.forEach(function (date) {
      var day = D.daily[date];
      if (!day) { skipped++; store.settledTo = date; return; }   // 読めない日は飛ばす（先へは進める）
      out.push(settleOneDay(day, notes));
      store.settledTo = date;
    });
    if (skipped) {
      notes.push({ kind: "skip", text: skipped + " 日ぶんは日次データが見つからなかったので飛ばしました（古い日は年ごとにまとめられています）。" });
    }
    touchLast();
    notes = notes.concat(processDelistings());
    saveStore();
    render();
    if (out.length) showBattle(out[out.length - 1], out.length, notes);
    else showNotes(notes);
  });
}

function settleOneDay(day, notes) {
  var date = day.date;

  // 分割・併合を先に反映してから、その日の対戦に入る
  applySplits(day, notes);

  // シーズンの切り替わり（月＝1 シーズン）
  var sid = seasonIdOf(date);
  if (store.season.id && store.season.id !== sid) closeSeason(notes);
  if (store.season.id !== sid) store.season = blankSeason(sid);

  var preds = store.predict[date] || {};
  var gain = 0, hits = 0, misses = 0;

  // 予想の答え合わせ（±0.3% 以内は引き分け＝外れ扱いにしない）
  var extras = {};
  store.party.forEach(function (code) {
    if (!code || !stateOf(code, day)) return;
    var p = preds[code];
    var chg = num(stateOf(code, day).chg1);
    var actual = chg > 0.003 ? "up" : chg < -0.003 ? "down" : "flat";
    var ex = {};
    if (p) {
      if (actual === "flat" || p === actual) {
        if (p === actual) { ex.hit = true; hits++; gain += 300; store.streak[code] = num(store.streak[code]) + 1; }
      } else { ex.hit = false; misses++; store.streak[code] = 0; }
    }
    extras[code] = ex;
  });
  if (hits === store.party.length && hits > 0) gain += 500;   // パーティ全的中のボーナス

  // 自軍と、その日の相場そのものである敵軍
  var mine = store.party.map(function (c) { return todayOf(c, day, extras[c] || {}); });
  var p = KB.protagonists(day);
  var foeCodes = [p.up, p.hot, p.down].filter(Boolean);
  while (foeCodes.length < 3) foeCodes.push(foeCodes[0]);
  var myRare = mine.reduce(function (s, b) { return s + b.kabu.rare; }, 0) / mine.length;
  var foes = foeCodes.slice(0, 3).map(function (c) {
    var b = todayOf(c, day, {});
    return KB.scaleToParty(b, myRare, b.kabu.rare);
  });

  var sqA = KB.squadOf(mine), sqB = KB.squadOf(foes);
  var res = CB.squadMatch(sqA, sqB, KB.hashStr(date));
  var win = res.scoreA > res.scoreB;

  // 稼ぎ: 相手の強さに応じて 500〜5000
  var foeStrength = foes.reduce(function (s, b) { return s + b.total; }, 0) / 3;
  if (win) gain += Math.round(500 + Math.max(0, Math.min(1, (foeStrength - 30) / 60)) * 4500);

  store.cash += gain;
  store.stats.days++;
  store.stats.hits += hits; store.stats.misses += misses;
  if (win) { store.stats.wins++; store.stats.streak++; store.stats.best = Math.max(store.stats.best, store.stats.streak); }
  else { store.stats.losses++; store.stats.streak = 0; }

  // シーズンの積み上げ（勝ち点・予想・編成の傾向。称号の材料）
  var se = store.season;
  var tags = mine.reduce(function (a, b) { return a.concat(b.kabu.tags || []); }, []);
  var traits = mine.reduce(function (a, b) { return a.concat(b.kabu.traitKeys || []); }, []);
  var uniqElems = new Set(mine.map(function (b) { return b.elem; })).size;
  se.days++; se.gain += gain; se.hits += hits; se.misses += misses;
  if (win) { se.wins++; se.points += 3; } else se.losses++;
  se.best = Math.max(num(se.best), store.stats.streak);
  if (tags.indexOf("注目") >= 0 || tags.indexOf("ストップ高") >= 0) se.hotDays++;
  if (traits.indexOf("regen") >= 0) se.divDays++;
  if (uniqElems >= 3) se.spreadDays++;
  if (uniqElems === 1) se.focusDays++;
  if (win && tags.indexOf("逆境") >= 0) se.comebacks++;
  se.peakAssets = Math.max(num(se.peakAssets), store.cash + heldValue());

  awardTitles(date, notes);

  var record = {
    date: date, win: win, scoreA: res.scoreA, scoreB: res.scoreB, gain: gain,
    foe: foeCodes.slice(0, 3).map(function (c) { return stockOf(c) ? stockOf(c).short : c; }).join("・"),
    mine: mine.map(function (b) { return b.name; }),
    hits: hits, misses: misses
  };
  store.results.unshift(record);
  store.results = store.results.slice(0, 60);
  delete store.predict[date];

  return { record: record, res: res, mine: mine, foes: foes };
}

// ══════════════ 対戦の再生（ログ表示）══════════════
function notesHtml(notes) {
  if (!notes || !notes.length) return "";
  return '<h3 style="margin-top:12px">この間に起きたこと</h3><ul class="notes">' +
    notes.map(function (n) { return '<li>' + esc(n.text) + '</li>'; }).join("") + '</ul>';
}

function showNotes(notes) {
  if (!notes || !notes.length) return;
  openDialog('<h2>お知らせ</h2>' + notesHtml(notes) +
    '<div class="row" style="margin-top:12px"><button data-close="1">閉じる</button></div>');
}

function showBattle(out, dayCount, notes) {
  var r = out.res, rec = out.record;
  var h = [];
  h.push('<h2>' + esc(rec.date) + ' の対戦' + (dayCount > 1 ? '（' + dayCount + ' 日ぶんを精算しました）' : '') + '</h2>');
  h.push('<div class="row" style="margin:8px 0">' +
    '<span class="' + (rec.win ? "up" : "down") + '" style="font-size:18px;font-weight:800">' +
    (rec.win ? "勝ち" : "負け") + ' ' + rec.scoreA + ' - ' + rec.scoreB + '</span>' +
    '<span class="muted">獲得 <b class="num">' + yen(rec.gain) + '</b> 円</span>' +
    (rec.hits ? '<span class="tag on">予想的中 ' + rec.hits + '</span>' : "") +
    (rec.misses ? '<span class="tag">予想外れ ' + rec.misses + '</span>' : "") + '</div>');

  h.push(notesHtml(notes));

  h.push('<div class="row" style="gap:16px;margin-bottom:8px">');
  [["自軍", out.mine], ["その日の相場", out.foes]].forEach(function (side) {
    h.push('<div style="flex:1;min-width:140px"><div class="small muted">' + side[0] + '</div>' +
      side[1].map(function (b) {
        return '<div class="small"><span class="' + elClass(b.elem) + '">' + b.element.name + '</span> ' + esc(b.name) + '</div>';
      }).join("") + '</div>');
  });
  h.push('</div>');

  h.push('<div class="log">');
  r.games.forEach(function (g, i) {
    h.push('<div class="gsep">第 ' + (i + 1) + ' 戦 — ' + (g.winnerSide === "A" ? "自軍" : "相手") + 'の勝ち（' +
      g.turns + ' ターン・' + esc(g.decision) + '）</div>');
    g.log.forEach(function (e) { h.push(logLine(e)); });
  });
  h.push('</div>');
  h.push('<div class="row" style="margin-top:12px"><button data-close="1">閉じる</button></div>');
  openDialog(h.join(""));
}

// エンジンは 1 行ぶんの文面を e.m に組み立て済み（誰の・どの技・何ダメージ・会心・有利/不利・吸収・連撃）。
// こちらは種別（e.t）で色を決めるだけにする。文面を自前で作り直すと、技名も属性相性も取りこぼす。
function logLine(e) {
  if (!e || !e.m) return "";
  var t = e.t, k;
  if (t === "note") k = "note";
  else if (t === "crit" || t === "finisher") k = "crit";
  else if (t === "miss") k = "miss";
  else if (t === "dot") k = "miss";
  else if (t === "buff") k = /倒れる/.test(e.m) ? "ko" : "note";
  else k = "hit";
  // 自軍の行だけ左に印を付ける（どちらが動いたかを目で追えるように）
  var mark = e.s === "A" ? "▸ " : "　";
  return '<div class="' + k + '">' + mark + esc(e.m) + '</div>';
}

// ══════════════ 契約 ══════════════
function buy(code) {
  var st = stateOf(code), u = stockOf(code);
  if (!st || !u || u.listed === false || store.cash < num(st.close)) return;
  store.cash -= num(st.close);
  var hd = store.holdings[code];
  if (hd) {
    hd.cost = (hd.cost * hd.units + num(st.close)) / (hd.units + 1);
    hd.units += 1;
    hd.last = num(st.close);
  } else store.holdings[code] = { units: 1, cost: num(st.close), last: num(st.close) };
  // 空きがあればパーティにも入れる
  var i = store.party.indexOf("");
  if (i >= 0 && store.party.indexOf(code) < 0) store.party[i] = code;
  saveStore(); render();
}

function sell(code) {
  var hd = store.holdings[code], st = stateOf(code);
  if (!hd || !st) return;
  var n = Math.min(1, hd.units);         // 併合で 1 口未満になっていることがある
  store.cash += num(st.close) * n;
  hd.units -= n;
  store.season.sells = num(store.season.sells) + 1;
  if (hd.units <= 1e-9) {
    delete store.holdings[code];
    var i = store.party.indexOf(code);
    if (i >= 0) store.party[i] = "";
  }
  saveStore(); render();
}

// ══════════════ セーブの持ち出し ══════════════
function exportSave() {
  var blob = new Blob([JSON.stringify(store, null, 1)], { type: "application/json" });
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "kabubattle-" + D.latest.date + ".json";
  a.click();
  setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
}

function importSave() {
  var inp = document.createElement("input");
  inp.type = "file"; inp.accept = "application/json,.json";
  inp.onchange = function () {
    var f = inp.files && inp.files[0];
    if (!f) return;
    var rd = new FileReader();
    rd.onload = function () {
      try {
        var j = JSON.parse(String(rd.result));
        if (!j || j.v !== 1) throw new Error("読めない形式です");
        localStorage.setItem(SAVE_KEY, JSON.stringify(j));
        loadStore(); render();
        openDialog('<h2>読み込みました</h2><div class="row" style="margin-top:12px"><button data-close="1">閉じる</button></div>');
      } catch (e) {
        openDialog('<h2>読み込めません</h2><div class="muted">' + esc(e.message) + '</div>' +
          '<div class="row" style="margin-top:12px"><button data-close="1">閉じる</button></div>');
      }
    };
    rd.readAsText(f);
  };
  inp.click();
}

// ══════════════ 操作 ══════════════
document.addEventListener("click", function (ev) {
  var t = ev.target.closest("[data-tab],[data-code],[data-buy],[data-sell],[data-sort],[data-slotin],[data-unslot],[data-pred],[data-close],[data-more],#btn-settle,#btn-export,#btn-import,#btn-reset");
  if (!t) return;

  if (t.hasAttribute("data-close")) { ev.preventDefault(); dlgCode = ""; $("dlg").close(); return; }
  if (t.id === "btn-settle") { ev.preventDefault(); settleAll(); return; }
  if (t.id === "btn-export") { ev.preventDefault(); exportSave(); return; }
  if (t.id === "btn-import") { ev.preventDefault(); importSave(); return; }
  if (t.id === "btn-reset") {
    ev.preventDefault();
    openDialog('<h2>最初からやり直しますか</h2><div class="muted">資金・契約・戦績・称号がすべて消えます。取り消せません。</div>' +
      '<div class="row" style="margin-top:12px"><button id="btn-reset-yes">やり直す</button><button data-close="1">やめる</button></div>');
    var y = $("btn-reset-yes");
    if (y) y.onclick = function () {
      try { localStorage.removeItem(SAVE_KEY); } catch (e) {}
      store = blankStore(); saveStore(); $("dlg").close(); render();
    };
    return;
  }
  if (t.hasAttribute("data-more")) {
    ev.preventDefault();
    var which = t.getAttribute("data-more");
    if (which === "market") marketQ.limit += 100; else bookQ.limit += 100;
    render(); return;
  }
  if (t.hasAttribute("data-tab")) { ev.preventDefault(); tab = t.getAttribute("data-tab"); dlgCode = ""; $("dlg").close(); render(); return; }
  if (t.hasAttribute("data-buy")) { ev.preventDefault(); buy(t.getAttribute("data-buy")); if ($("dlg").open) showStock(t.getAttribute("data-buy")); return; }
  if (t.hasAttribute("data-sell")) {
    ev.preventDefault();
    var sc = t.getAttribute("data-sell");
    sell(sc);
    if ($("dlg").open) { if (store.holdings[sc] || stateOf(sc)) showStock(sc); else { dlgCode = ""; $("dlg").close(); } }
    return;
  }
  if (t.hasAttribute("data-sort")) {
    var k = t.getAttribute("data-sort");
    if (marketSort.key === k) marketSort.desc = !marketSort.desc; else { marketSort.key = k; marketSort.desc = true; }
    render(); return;
  }
  if (t.hasAttribute("data-slotin")) {
    ev.preventDefault();
    var code = t.getAttribute("data-slotin");
    var i = store.party.indexOf("");
    if (i < 0) i = 2;
    store.party[i] = code; saveStore(); render(); return;
  }
  if (t.hasAttribute("data-unslot")) { ev.preventDefault(); store.party[Number(t.getAttribute("data-unslot"))] = ""; saveStore(); render(); return; }
  if (t.hasAttribute("data-pred")) {
    ev.preventDefault();
    var c = t.getAttribute("data-pred"), v = t.getAttribute("data-val");
    var d = D.latest.date;
    store.predict[d] = store.predict[d] || {};
    if (store.predict[d][c] === v) delete store.predict[d][c]; else store.predict[d][c] = v;
    saveStore(); render(); return;
  }
  if (t.hasAttribute("data-code")) { ev.preventDefault(); showStock(t.getAttribute("data-code")); return; }
});

// 検索欄（打つたびに絞り込む）
document.addEventListener("input", function (ev) {
  var t = ev.target;
  if (t.id === "mkt-q") { marketQ.q = t.value; marketQ.limit = 100; renderKeepFocus(t); }
  else if (t.id === "book-q") { bookQ.q = t.value; bookQ.limit = 100; renderKeepFocus(t); }
});

// 絞り込みの選択肢
document.addEventListener("change", function (ev) {
  var t = ev.target, id = t.id || "";
  var q = id.indexOf("mkt-") === 0 ? marketQ : (id.indexOf("book-") === 0 ? bookQ : null);
  if (!q) return;
  var key = id.slice(id.indexOf("-") + 1);
  if (key === "elem") q.elem = t.value;
  else if (key === "rare") q.rare = t.value;
  else if (key === "idx") q.idx = t.value;
  else if (key === "fin") q.fin = t.value;
  else if (key === "held") q.held = !!t.checked;
  else return;
  q.limit = 100;
  render();
});

// ══════════════ 起動 ══════════════
function fail(msg) {
  $("main").innerHTML = '<div class="card"><h2>データが読めません</h2><div class="muted">' + esc(msg) +
    '</div><div class="muted small" style="margin-top:8px">' +
    'ローカルのファイルを直接開くとブラウザの制限で読み込めません。' +
    '公開ページ（https://ksaga115.github.io/KabuBattle/）か、ローカルなら簡易サーバー越しに開いてください。</div></div>';
}

Promise.all([
  loadJson("kabu/universe.json"),
  loadJson("kabu/data/latest.json"),
  loadJson("kabu/moves.json").catch(function () { return null; }),
  // 日次の履歴の目次。まだ無いこともある（その場合は latest.json の 1 日だけを精算する）
  loadJson("kabu/data/index.json").catch(function () { return null; })
]).then(function (r) {
  D.universe = r[0]; D.latest = r[1]; D.moves = r[2]; D.index = r[3];
  if (!D.universe || !D.universe.stocks) throw new Error("universe.json に stocks がありません");
  if (!D.latest || !D.latest.stocks || !D.latest.date) throw new Error("latest.json が壊れています");
  computeTop10();
  computeIdxOptions();
  loadStore();
  // 上場廃止の後始末は起動時に一度だけ（設計書 §8.4）。何が起きたかは必ず画面に出す。
  touchLast();
  var notes = processDelistings();
  saveStore();
  render();
  if (notes.length) showNotes(notes);
}).catch(function (e) { fail(e.message); });

})();
</script>
