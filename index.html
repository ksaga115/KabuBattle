    const perm = permutation((S[1] >>> 9) ^ (f.comp & 0x7F));
    const stats = {};
    for (let i = 0; i < 5; i++) {
      // 下限を上げて「1ステータスが死んでいる個体」をなくす（1v1で機能不全になるのを防ぐ）
      stats[STAT_KEYS[i]] = clamp(Math.round(raw[perm[i]] + grade + temper.off[i]), 24, 100);
    }

    let sum = 0; for (let i = 0; i < 5; i++) sum += stats[STAT_KEYS[i]];
    const total = Math.round(sum / 5);

    // 名前: 実在する日本語の単語2つを組み合わせる。融合コード（"FUSION:..."）なら
    // 親2体の単語から新しい組み合わせを作る（新しい生成ロジックではなく、既存の beastOf を再帰的に使うだけ）。
    let name, prefixWord, suffixWord;
    const fusionParts = parseFusionCode(normalized);
    if (fusionParts) {
      const pa = beastOf(fusionParts[0]), pb = beastOf(fusionParts[1]);
      const fn = composeFusionName(pa, pb, hAll);
      name = fn.name; prefixWord = fn.prefixWord; suffixWord = fn.suffixWord;
    } else {
      prefixWord = NAME_PREFIX[(S[0] >>> 11) % NAME_PREFIX.length];
      suffixWord = NAME_SUFFIX[(S[2] >>> 13) % NAME_SUFFIX.length];
      name = prefixWord + suffixWord;
    }
    const sid = ("0000" + ((hAll >>> 16) & 0xFFFF).toString(16).toUpperCase()).slice(-4);

    // 技（攻撃手段）: 既存の値を消費するだけで乱数の並びには触れない（他の項目に影響しない追加要素）。
    // 1本目は自分の属性（十八番）、2・3本目はハッシュで別に決まる（他属性のカバー技になり得る）。
    const moveElems = [
      elemIdx,
      ((S[6] >>> 7) ^ (hAll >>> 3) ^ (f.shape >>> 4)) % 5,
      ((S[7] >>> 11) ^ (hAll >>> 15) ^ (f.foldB >>> 6)) % 5
    ];
    const usedKinds = Object.create(null);
    const moves = moveElems.map(function (me, i) {
      let kb = ((S[(i + 2) % 8] >>> (3 + i * 5)) ^ (hAll >>> (i * 3 + 1)) ^ (f.comp >>> i)) >>> 0;
      let kind = MOVE_KIND_POOL[kb % MOVE_KIND_POOL.length];
      let tries = 0;
      while (usedKinds[kind] && tries < MOVE_KIND_POOL.length) { kb = (kb + 0x9E3779B9) >>> 0; kind = MOVE_KIND_POOL[kb % MOVE_KIND_POOL.length]; tries++; }
      usedKinds[kind] = true;
      return { elem: me, element: ELEMENTS[me], kind: kind, name: ELEMENTS[me].name + "・" + MOVE_KIND_NAME[kind] };
    });

    return {
      code: normalized, name: name, sid: sid,
      prefixWord: prefixWord, suffixWord: suffixWord,
      stats: stats, sum: sum, total: total, rank: rankOf(total),
      elem: elemIdx, element: ELEMENTS[elemIdx],
      temper: temper.name, trait: trait, hash: hAll >>> 0,
      moves: moves
    };
  }

  const cache = Object.create(null);
  function beastOf(text) {
    const key = normalize(text);
    const hit = cache[key];
    if (hit) return hit;
    const v = build(key);
    cache[key] = v;
    return v;
  }

  // ══════════════ 自動対戦 ══════════════

  function mkFighter(beast, side, mastery) {
    const st = beast.stats;
    return {
      beast: beast, side: side, name: beast.name,
      atk: st.ATK, def: st.DEF, spd: st.SPD, tec: st.TEC, luk: st.LUK,
      trait: beast.trait.key, elem: beast.elem, moves: beast.moves || [],
      mastery: Math.max(0, Math.min(5, (mastery | 0))),
      // DEF が主だが SPD も少し体力に効く。total 依存は弱め（強個体が過度にタンクにならないよう）
      maxHp: Math.round(250 + st.DEF * 2.7 + st.SPD * 0.9 + beast.total * 0.7),
      hp: 0, defDrop: 0, endured: false, desperate: false,
      crits: 0, hits: 0, dodges: 0, extra: 0, dealt: 0, favHits: 0, finisherHits: 0
    };
  }

  /** 2体の自動対戦。順番を入れ替えても同じ結果になるよう種は対称に作る。
   *  gameSeed を渡すと展開が変わる（個体は不変・種だけ差し替え）。同じ gameSeed なら再現する。 */
  function battle(beastA, beastB, gameSeed, mstA, mstB, despSide) {
    const A = mkFighter(beastA, "A", mstA), B = mkFighter(beastB, "B", mstB);
    A.hp = A.maxHp; B.hp = B.maxHp;
    // 背水の陣: マッチで負けている側は、そのゲームだけ少し粘り強くなる（一発逆転の後押し）
    A.desperate = despSide === "A"; B.desperate = despSide === "B";
    // その日・その一戦の「調子」。TOTAL差がわずかでも大差になりすぎないよう、全ステータスを試合単位でまとめてぶらす
    // （ターン内の乱数と違い、ターン数が多くても打ち消し合って薄まらない）。
    applyCondition(A, conditionRoll(beastA.hash, gameSeed));
    applyCondition(B, conditionRoll(beastB.hash, gameSeed));

    const lo = Math.min(beastA.hash, beastB.hash), hi = Math.max(beastA.hash, beastB.hash);
    const baseSeed = (Math.imul(lo, 0x85EBCA6B) ^ Math.imul(hi, 0xC2B2AE35) ^ 0x5BF03635) >>> 0;
    const rnd = sm32((baseSeed ^ Math.imul((gameSeed >>> 0) || 0, 0x9E3779B1)) >>> 0);

    const log = [];
    // 演出用に、その時点のHPを各ログへ添える
    function push(o) { o.ha = Math.max(0, A.hp); o.hb = Math.max(0, B.hp); log.push(o); }
    if (A.desperate) push({ t: "note", s: "A", r: 0, m: A.name + " は背水の陣（このゲームは粘る）" });
    if (B.desperate) push({ t: "note", s: "B", r: 0, m: B.name + " は背水の陣（このゲームは粘る）" });

    /** 技（攻撃手段）を自動で選ぶ。瀕死なら捨身の一撃、それ以外は相手への相性が良い技を優先。 */
    function chooseMove(at, df) {
      const list = at.moves;
      if (!list || !list.length) return { elem: at.elem, element: ELEMENTS[at.elem], kind: "strike", name: "一撃" };
      const finisher = list.find(function (m) { return m.kind === "finisher"; });
      const finThresh = at.desperate ? 0.28 : 0.18;
      if (finisher && at.hp / at.maxHp <= finThresh) return finisher;
      let best = null, bestScore = -1;
      for (let i = 0; i < list.length; i++) {
        const m = list[i];
        if (m.kind === "finisher") continue;
        const score = affinity(m.elem, df.elem) * (MOVE_POWER[m.kind] || 1) + rnd() * 0.06;
        if (score > bestScore) { bestScore = score; best = m; }
      }
      return best || list[0];
    }

    // 行動順は 速 のみ（＋特性）。運は関与しない。
    function orderScore(x, round) {
      let s = x.spd;
      if (x.trait === "swift") s *= 1.16;
      if (x.trait === "crush") s *= 0.85;
      if (round === 1 && x.trait === "swift") s += 45;
      return s;
    }

    function strike(at, df) {
      const move = chooseMove(at, df);

      // 回避 = 速の差（＋守勢の特性）。技が命中を底上げして回避を相殺する。
      let ev = 0.035 + (df.spd - at.spd) * 0.0050 - at.tec * 0.0018;
      if (df.trait === "serene") ev += 0.05;
      if (df.trait === "swift") ev += 0.03;
      if (at.trait === "focus") ev -= at.tec * 0.0012;
      ev = clamp(ev, 0.01, 0.38);
      if (rnd() < ev) { df.dodges++; return { dodge: true, dmg: 0, aff: 1, move: move }; }

      // 基礎ダメージは 攻 × 技の威力係数。
      let base = at.atk * 0.92 * (MOVE_POWER[move.kind] || 1);
      if (at.trait === "fang") base *= 1.12;
      if (at.trait === "crush") base *= 1.25;
      if (at.trait === "gale") base *= (1 + at.spd * 0.0035);
      if (at.trait === "focus") base *= (1 + at.tec * 0.0026);
      if (at.trait === "wrath" && at.hp / at.maxHp < 0.35) base *= 1.35;
      if (at.desperate) base *= 1.05;

      // 技は 守 を少し貫通。calc・克撃はさらに上乗せ。
      let defEff = df.def * (1 - df.defDrop) * (1 - Math.min(0.22, at.tec / 100 * 0.22));
      if (move.kind === "pierce") defEff *= 0.78;
      if (at.trait === "calc") defEff *= 0.68;
      if (df.trait === "wall") base *= 0.88;
      if (df.trait === "serene") base *= 0.96;

      // 相性は「使った技の属性」対「相手の属性」で決まる（同じ個体でも技によって有利不利が変わる）
      const aff = affinity(move.elem, df.elem);
      let dmg = base * (150 / (150 + defEff * 1.35));
      // 技(TEC) = 防御を無視する確定ダメージ（精密打撃）。技型のアイデンティティ。
      dmg += at.tec * 0.55;
      dmg *= aff;

      // 振れ幅: 運が広げ、技が狭める（安定 ⇔ 一発）。熟練度でさらに少し狭まる。
      let spread = clamp(0.17 * (1 + at.luk / 100 * 0.95 - at.tec / 100 * 0.70), 0.05, 0.32);
      spread *= (1 - Math.min(0.10, at.mastery * 0.02));
      dmg *= (1 - spread) + rnd() * 2 * spread;

      // 運 = 会心（一発型のアイデンティティ）。会心撃・背水の陣はさらに上がる。
      let crit = clamp(0.025 + at.luk * 0.0050 + (move.kind === "crit" ? 0.09 : 0) + (at.desperate ? 0.03 : 0), 0, 0.5);
      if (at.trait === "luck") crit *= 1.9;
      if (df.trait === "serene") crit *= 0.45;
      const isCrit = rnd() < crit;
      if (isCrit) { dmg *= (1.65 + at.luk / 100 * 1.0); at.crits++; }
      if (aff >= 1.08) at.favHits++;
      if (move.kind === "finisher") at.finisherHits++;

      dmg = Math.max(1, Math.round(dmg));
      df.hp -= dmg; at.dealt += dmg; at.hits++;

      if (move.kind === "drain") { const heal = Math.round(dmg * 0.35); at.hp = Math.min(at.maxHp, at.hp + heal); }

      let reflected = 0;
      if (df.trait === "reflect") {
        reflected = Math.max(1, Math.round(dmg * 0.18));
        at.hp -= reflected;
      }
      if (df.hp <= 0 && df.trait === "endure" && !df.endured) { df.endured = true; df.hp = 1; }
      return { dodge: false, dmg: dmg, crit: isCrit, reflected: reflected, aff: aff, move: move };
    }

    let round = 0;
    const MAXR = 24;
    while (round < MAXR && A.hp > 0 && B.hp > 0) {
      round++;
      const sa = orderScore(A, round), sb = orderScore(B, round);
      const first = (sa > sb) ? A : (sb > sa) ? B : (beastA.hash >= beastB.hash ? A : B);
      const seq = [first, (first === A) ? B : A];

      for (let q = 0; q < 2; q++) {
        const at = seq[q];
        if (at.hp <= 0) continue;
        const df = (at === A) ? B : A;
        if (df.hp <= 0) break;
        let times = 1;
        if (at.trait === "twin" && rnd() < 0.18) { times = 2; at.extra++; }
        for (let t = 0; t < times && df.hp > 0 && at.hp > 0; t++) {
          const r = strike(at, df);
          if (r.dodge) {
            push({ t: "miss", s: at.side, r: round, m: df.name + " が攻撃をかわした" });
          } else {
            push({
              t: r.move.kind === "finisher" ? "finisher" : (r.crit ? "crit" : "hit"), s: at.side, r: round,
              m: at.name + " の「" + r.move.name + "」" + (r.move.kind === "finisher" ? "！！ " : "") +
                " → " + r.dmg + " ダメージ" + (r.crit ? "（会心）" : "") +
                (r.aff >= 1.08 ? "（有利）" : (r.aff <= 0.92 ? "（不利）" : "")) +
                (r.move.kind === "drain" ? "（吸収）" : "") +
                (t > 0 ? "（連撃）" : "") + (r.reflected ? " ／ 反射 " + r.reflected : "")
            });
          }
        }
      }

      // 処理順をスロットではなく個体で決める（AとBを入れ替えても同じ結果にするため）
      const pair = (beastA.hash >= beastB.hash) ? [A, B] : [B, A];
      for (let q = 0; q < 2; q++) {
        const x = pair[q], y = (x === A) ? B : A;
        if (x.hp <= 0) continue;
        if (x.trait === "regen" && x.hp < x.maxHp) {
          const h = Math.round(x.maxHp * 0.025);
          x.hp = Math.min(x.maxHp, x.hp + h);
          push({ t: "buff", s: x.side, r: round, m: x.name + " が " + h + " 回復" });
        }
        if (x.trait === "curse") y.defDrop = Math.min(0.40, y.defDrop + 0.06);
        if (x.trait === "venom" && y.hp > 0) {
          const d = Math.max(1, Math.round(y.maxHp * 0.02));
          y.hp -= d;
          push({ t: "dot", s: x.side, r: round, m: y.name + " は蝕毒で " + d + " ダメージ" });
        }
      }
    }

    let winner, loser, decision;
    if (A.hp <= 0 && B.hp <= 0) {
      winner = (A.luk !== B.luk) ? (A.luk > B.luk ? A : B) : (beastA.hash >= beastB.hash ? A : B);
      decision = "相打ち";
    } else if (A.hp <= 0 || B.hp <= 0) {
      winner = (A.hp > 0) ? A : B; decision = "撃破";
    } else {
      const ra = A.hp / A.maxHp, rb = B.hp / B.maxHp;
      winner = (ra !== rb) ? (ra > rb ? A : B) : (beastA.hash >= beastB.hash ? A : B);
      decision = "判定";
    }
    loser = (winner === A) ? B : A;

    const wb = winner.beast, lb = loser.beast;
    let reason;
    if (winner.desperate && loser.hp <= 0) reason = "背水の陣からの大逆転";
    else if (winner.finisherHits >= 1 && loser.hp <= 0) reason = "捨身の一撃が決め手になった一発逆転";
    else if (wb.total < lb.total - 3) reason = "格上を相性と特性で崩した番狂わせ";
    else if (winner.favHits >= 2) reason = "技の相性で押し切った";
    else if (winner.crits >= 3) reason = "会心の一撃を重ねて決着";
    else if (round <= 4) reason = "圧倒的な速攻で沈めた";
    else if (winner.hp / winner.maxHp > 0.6) reason = "堅い守りを崩されず完勝";
    else if (winner.dodges >= 4) reason = "速さで攻撃をかわし続けた";
    else if (winner.extra >= 2) reason = "特性「" + wb.trait.name + "」がかみ合った";
    else if (decision === "判定") reason = "決着つかず、残りHPの差で判定勝ち";
    else reason = "地力の差で押し切った";

    return {
      winner: wb, loser: lb, winnerSide: winner.side,
      turns: round, decision: decision, reason: reason, log: log,
      hpA: Math.max(0, A.hp), maxHpA: A.maxHp, hpB: Math.max(0, B.hp), maxHpB: B.maxHp,
      statsA: { crits: A.crits, dodges: A.dodges, dealt: A.dealt },
      statsB: { crits: B.crits, dodges: B.dodges, dealt: B.dealt }
    };
  }

  /** 2本先取（最大3ゲーム）のマッチ。salt に日付や再戦回数を混ぜると毎回展開が変わる。
   *  A/B を入れ替えても結果は同じ（各ゲームの種を対称に作る）。 */
  function match(beastA, beastB, salt, mstA, mstB) {
    salt = (salt >>> 0) || 0;
    const games = [];
    let wa = 0, wb = 0;
    for (let k = 0; k < 3; k++) {
      const gs = (Math.imul(salt + 0x9E3779B9, 0x27D4EB2F) ^ Math.imul(k + 1, 0x85EBCA6B)) >>> 0;
      // 背水の陣: 直前までのスコアで負けている側に、そのゲームだけ後押しを与える
      const desp = wa > wb ? "B" : (wb > wa ? "A" : null);
      const g = battle(beastA, beastB, gs, mstA, mstB, desp);
      g.gameSeed = gs;
      games.push(g);
      if (g.winnerSide === "A") wa++; else wb++;
      if (wa === 2 || wb === 2) break;
    }
    const winnerSide = (wa > wb) ? "A" : "B";
    return {
      games: games, count: games.length,
      scoreA: wa, scoreB: wb, winnerSide: winnerSide,
      winner: (winnerSide === "A") ? beastA : beastB,
      loser: (winnerSide === "A") ? beastB : beastA
    };
  }

  // ══════════════ スカッド（3体編成）対戦 ══════════════

  /** コード内容から読める「系統」ラベル（共鳴の判定に使う） */
  function familyTag(s) {
    s = String(s == null ? "" : s);
    const d = s.replace(/[-\s]/g, "");
    if (/^97[89]\d{10}$/.test(d)) return "BOOK";
    if (/^https?:\/\//i.test(s)) {
      const m = s.match(/^https?:\/\/[^/]*?\.([a-z]{2,})(?=[:/]|$)/i);
      return "URL:" + (m ? m[1].toLowerCase() : "x");
    }
    if (/^(WIFI|MECARD|MATMSG|BEGIN:VCARD|GEO:|TEL:|MAILTO:|SMSTO):/i.test(s)) return "QR:" + s.split(/[:;]/)[0].toUpperCase();
    if (/^\d{8}$/.test(d) || /^\d{12,14}$/.test(d)) return "JAN:" + d.slice(0, 2);
    if (/^\d+$/.test(d) && d.length >= 4) return "NUM:" + (d.length <= 6 ? "S" : d.length <= 12 ? "M" : "L");
    if (s.length <= 24 && /^[A-Z0-9\-. $/+%*]+$/.test(s)) return "TEXT";
    return "MISC";
  }

  const SYNERGY_DEFS = [
    { key: "fortress", name: "要塞陣" },
    { key: "collapse", name: "崩壊" },
    { key: "pierce", name: "貫通陣" },
    { key: "firststrike", name: "先制必中会心" },
    { key: "rest", name: "静養" }
  ];

  /** 3体（前衛/中衛/後衛）のトレイトから、隊のオーラ・シナジー・共鳴をまとめる */
  function squadAura(traits, reso) {
    const a = { dmgMul: 1, takenMul: 1, critAdd: 0, pierce: 0, regen: 0, curseTick: 0, venomTick: 0, firstStrike: 0, enemyCritAdd: 0, synergies: [] };
    const bench = [traits[1], traits[2]];
    const has = function (t) { return traits.indexOf(t) >= 0; };
    const benchHas = function (t) { return bench.indexOf(t) >= 0; };
    bench.forEach(function (t) {
      if (t === "fang") a.dmgMul *= 1.05;
      else if (t === "wall") a.takenMul *= 0.95;
      else if (t === "calc") a.pierce += 0.10;
      else if (t === "luck") a.critAdd += 0.015;
      else if (t === "curse") a.curseTick += 0.025;
      else if (t === "venom") a.venomTick += 0.009;
      else if (t === "regen") a.regen += 0.014;
      else if (t === "focus") a.dmgMul *= 1.02;
      else if (t === "serene") a.enemyCritAdd -= 0.01;
    });
    const auraBench = ["fang", "wall", "calc", "luck", "curse", "venom", "regen", "serene"];
    if (traits[0] === "wall" && auraBench.some(benchHas)) { a.takenMul *= 0.97; a.synergies.push("要塞陣"); }
    if (has("curse") && has("venom")) { a.curseTick *= 1.5; a.venomTick *= 1.5; a.synergies.push("崩壊"); }
    if (traits[0] === "fang" && benchHas("calc")) { a.dmgMul *= 1.08; a.synergies.push("貫通陣"); }
    if (traits[0] === "swift" && benchHas("luck")) { a.critAdd += 0.05; a.firstStrike = 1; a.synergies.push("先制必中会心"); }
    if (benchHas("regen") && benchHas("serene")) { a.regen *= 1.5; a.synergies.push("静養"); }
    if (reso && reso.family) { a.dmgMul *= 1.04; a.takenMul *= 0.97; a.synergies.push("同族共鳴"); }
    if (reso && reso.session) { a.dmgMul *= 1.03; a.firstStrike = 1; a.synergies.push("同刻共鳴"); }
    return a;
  }

  /** スカッド1ゲーム。sq = { beasts:[b,b,b], mastery:[m,m,m], reso:{family,session} }。前衛が受け、倒れると繰り上がる。 */
  function squadBattle(sqA, sqB, gameSeed, despSide) {
    const hashesA = sqA.beasts.map(function (b) { return b.hash; });
    const hashesB = sqB.beasts.map(function (b) { return b.hash; });
    // 両隊とも同じ畳み方（側に依存しない＝A/B を入れ替えても同じ結果）
    const foldSquad = function (hs) {
      return hs.reduce(function (x, h) { return (x ^ Math.imul(h >>> 0, 0x85EBCA6B)) >>> 0; }, 0x9E3779B9);
    };
    const foldA = foldSquad(hashesA), foldB = foldSquad(hashesB);
    const lo = Math.min(foldA, foldB), hi = Math.max(foldA, foldB);
    const rnd = sm32(((Math.imul(lo, 0x85EBCA6B) ^ Math.imul(hi, 0xC2B2AE35)) ^ Math.imul((gameSeed >>> 0) || 0, 0x9E3779B1)) >>> 0);

    function mkLine(sq) {
      return sq.beasts.map(function (b, i) {
        const fx = mkFighter(b, null, sq.mastery ? sq.mastery[i] : 0);
        applyCondition(fx, conditionRoll(b.hash, gameSeed));
        fx.hp = fx.maxHp;
        return fx;
      });
    }
    const LA = mkLine(sqA), LB = mkLine(sqB);
    // 背水の陣: マッチで負けている隊は、そのゲームだけ全員が少し粘り強くなる
    if (despSide === "A") LA.forEach(function (f) { f.desperate = true; });
    if (despSide === "B") LB.forEach(function (f) { f.desperate = true; });
    const traitsA = LA.map(function (f) { return f.trait; });
    const traitsB = LB.map(function (f) { return f.trait; });
    const auA = squadAura(traitsA, sqA.reso), auB = squadAura(traitsB, sqB.reso);
    auA.critAdd += auB.enemyCritAdd;
    auB.critAdd += auA.enemyCritAdd;

    let iA = 0, iB = 0; // 現・前衛のインデックス
    const log = [];
    const push = function (o) {
      o.ha = Math.max(0, LA[iA] ? LA[iA].hp : 0);
      o.hb = Math.max(0, LB[iB] ? LB[iB].hp : 0);
      o.fa = iA; o.fb = iB;
      log.push(o);
    };
    if (auA.synergies.length) push({ t: "note", s: "A", r: 0, m: "A隊: " + auA.synergies.join("・") });
    if (auB.synergies.length) push({ t: "note", s: "B", r: 0, m: "B隊: " + auB.synergies.join("・") });
    if (despSide) push({ t: "note", s: despSide, r: 0, m: (despSide === "A" ? "A隊" : "B隊") + " は背水の陣（このゲームは粘る）" });

    /** 技を自動で選ぶ。瀕死なら捨身の一撃、それ以外は相手への相性が良い技を優先。 */
    function chooseMove(at, df) {
      const list = at.moves;
      if (!list || !list.length) return { elem: at.elem, element: ELEMENTS[at.elem], kind: "strike", name: "一撃" };
      const finisher = list.find(function (m) { return m.kind === "finisher"; });
      const finThresh = at.desperate ? 0.28 : 0.18;
      if (finisher && at.hp / at.maxHp <= finThresh) return finisher;
      let best = null, bestScore = -1;
      for (let i = 0; i < list.length; i++) {
        const m = list[i];
        if (m.kind === "finisher") continue;
        const score = affinity(m.elem, df.elem) * (MOVE_POWER[m.kind] || 1) + rnd() * 0.06;
        if (score > bestScore) { bestScore = score; best = m; }
      }
      return best || list[0];
    }

    function hit(at, df, myAura, foeAura) {
      const move = chooseMove(at, df);
      let ev = 0.035 + (df.spd - at.spd) * 0.0050 - at.tec * 0.0018;
      if (df.trait === "serene") ev += 0.05;
      if (df.trait === "swift") ev += 0.03;
      ev = clamp(ev, 0.01, 0.38);
      if (rnd() < ev) { df.dodges++; return { dodge: true, dmg: 0, aff: 1, move: move }; }

      let base = at.atk * 0.92 * (MOVE_POWER[move.kind] || 1) * myAura.dmgMul;
      if (at.trait === "fang") base *= 1.12;
      if (at.trait === "crush") base *= 1.25;
      if (at.trait === "gale") base *= (1 + at.spd * 0.0035);
      if (at.trait === "focus") base *= (1 + at.tec * 0.0026);
      if (at.trait === "wrath" && at.hp / at.maxHp < 0.35) base *= 1.35;
      if (at.desperate) base *= 1.05;

      let defEff = df.def * (1 - df.defDrop) * (1 - Math.min(0.36, at.tec / 100 * 0.22 + myAura.pierce + (move.kind === "pierce" ? 0.14 : 0)));
      if (at.trait === "calc") defEff *= 0.68;
      if (df.trait === "wall") base *= 0.88;
      if (df.trait === "serene") base *= 0.96;

      const aff = affinity(move.elem, df.elem);
      let dmg = base * (150 / (150 + defEff * 1.35));
      dmg += at.tec * 0.55;                 // 確定ダメージ（技）
      dmg *= aff * foeAura.takenMul;
      let spread = clamp(0.17 * (1 + at.luk / 100 * 0.95 - at.tec / 100 * 0.70), 0.05, 0.32);
      spread *= (1 - Math.min(0.10, at.mastery * 0.02));
      dmg *= (1 - spread) + rnd() * 2 * spread;

      let crit = clamp(0.025 + at.luk * 0.0050 + myAura.critAdd + (move.kind === "crit" ? 0.09 : 0) + (at.desperate ? 0.03 : 0), 0, 0.5);
      if (at.trait === "luck") crit *= 1.9;
      if (df.trait === "serene") crit *= 0.45;
      const isCrit = rnd() < crit;
      if (isCrit) { dmg *= (1.65 + at.luk / 100 * 1.0); at.crits++; }

      dmg = Math.max(1, Math.round(dmg));
      df.hp -= dmg; at.dealt += dmg; at.hits++;
      if (move.kind === "drain") { const heal = Math.round(dmg * 0.35); at.hp = Math.min(at.maxHp, at.hp + heal); }
      if (df.hp <= 0 && df.trait === "endure" && !df.endured) { df.endured = true; df.hp = 1; }
      return { dodge: false, dmg: dmg, crit: isCrit, aff: aff, move: move };
    }

    let round = 0;
    const MAXR = 40;
    while (round < MAXR && iA < 3 && iB < 3) {
      round++;
      const A = LA[iA], B = LB[iB];
      let sa = A.spd + (A.trait === "swift" ? A.spd * 0.16 : 0) + (round === 1 ? auA.firstStrike * 25 : 0);
      let sb = B.spd + (B.trait === "swift" ? B.spd * 0.16 : 0) + (round === 1 ? auB.firstStrike * 25 : 0);
      const first = (sa > sb) ? "A" : (sb > sa) ? "B" : (foldA >= foldB ? "A" : "B");
      const seq = first === "A" ? ["A", "B"] : ["B", "A"];

      for (let q = 0; q < 2; q++) {
        const atkSide = seq[q];
        const at = atkSide === "A" ? LA[iA] : LB[iB];
        const df = atkSide === "A" ? LB[iB] : LA[iA];
        if (!at || !df || at.hp <= 0 || df.hp <= 0) continue;
        const myAura = atkSide === "A" ? auA : auB;
        const foeAura = atkSide === "A" ? auB : auA;
        let times = 1;
        if (at.trait === "twin" && rnd() < 0.22) { times = 2; at.extra++; }
        for (let t = 0; t < times && df.hp > 0 && at.hp > 0; t++) {
          const r = hit(at, df, myAura, foeAura);
          if (r.dodge) push({ t: "miss", s: atkSide, r: round, m: df.name + " が回避" });
          else push({
            t: r.move.kind === "finisher" ? "finisher" : (r.crit ? "crit" : "hit"), s: atkSide, r: round,
            m: at.name + " の「" + r.move.name + "」" + (r.move.kind === "finisher" ? "！！" : "") +
              " → " + r.dmg + (r.crit ? " 会心" : "") +
              (r.aff >= 1.08 ? " 有利" : (r.aff <= 0.92 ? " 不利" : "")) +
              (r.move.kind === "drain" ? " 吸収" : "") + (t > 0 ? " 連撃" : "")
          });
        }
        if (df.hp <= 0) {
          const dfSide = atkSide === "A" ? "B" : "A";
          push({ t: "buff", s: dfSide, r: round, m: df.name + " 倒れる" });
          if (dfSide === "A") iA++; else iB++;
        }
      }

      // ターン終わりの隊オーラ（呪詛/蝕毒/再生）。処理順は fold で固定＝A/B を入れ替えても同じ。
      (foldA >= foldB ? ["A", "B"] : ["B", "A"]).forEach(function (side) {
        const isA = side === "A";
        const au = isA ? auA : auB;
        const meF = isA ? LA[iA] : LB[iB];
        const foeF = isA ? LB[iB] : LA[iA];
        if (meF && meF.hp > 0 && au.regen > 0 && meF.hp < meF.maxHp) {
          const h = Math.round(meF.maxHp * Math.min(0.04, au.regen));
          meF.hp = Math.min(meF.maxHp, meF.hp + h);
          push({ t: "buff", s: side, r: round, m: meF.name + " +" + h + " 回復" });
        }
        if (foeF && foeF.hp > 0) {
          if (au.curseTick > 0) foeF.defDrop = Math.min(0.4, foeF.defDrop + au.curseTick);
          if (au.venomTick > 0) {
            const d = Math.max(1, Math.round(foeF.maxHp * Math.min(0.022, au.venomTick)));
            foeF.hp -= d;
            push({ t: "dot", s: side, r: round, m: foeF.name + " 蝕毒 -" + d });
            if (foeF.hp <= 0) { if (isA) iB++; else iA++; }
          }
        }
      });
    }

    const aliveA = LA.reduce(function (n, f) { return n + (f.hp > 0 ? 1 : 0); }, 0);
    const aliveB = LB.reduce(function (n, f) { return n + (f.hp > 0 ? 1 : 0); }, 0);
    const hpFracA = LA.reduce(function (s, f) { return s + Math.max(0, f.hp) / f.maxHp; }, 0);
    const hpFracB = LB.reduce(function (s, f) { return s + Math.max(0, f.hp) / f.maxHp; }, 0);
    let winnerSide;
    if (aliveA !== aliveB) winnerSide = aliveA > aliveB ? "A" : "B";
    else if (Math.abs(hpFracA - hpFracB) > 1e-6) winnerSide = hpFracA > hpFracB ? "A" : "B";
    else winnerSide = foldA >= foldB ? "A" : "B";

    const decision = (aliveA === 0 || aliveB === 0) ? "殲滅" : "判定";
    return {
      log: log, turns: round, decision: decision, winnerSide: winnerSide,
      aliveA: aliveA, aliveB: aliveB,
      dealtA: LA.reduce(function (s, f) { return s + f.dealt; }, 0),
      dealtB: LB.reduce(function (s, f) { return s + f.dealt; }, 0),
      critsA: LA.reduce(function (s, f) { return s + f.crits; }, 0),
      critsB: LB.reduce(function (s, f) { return s + f.crits; }, 0),
      synergiesA: auA.synergies, synergiesB: auB.synergies,
      lineA: LA.map(function (f) { return { name: f.name, hp: Math.max(0, Math.round(f.hp)), maxHp: f.maxHp }; }),
      lineB: LB.map(function (f) { return { name: f.name, hp: Math.max(0, Math.round(f.hp)), maxHp: f.maxHp }; })
    };
  }

  /** スカッドの2本先取マッチ */
  function squadMatch(sqA, sqB, salt) {
    salt = (salt >>> 0) || 0;
    const games = [];
    let wa = 0, wb = 0;
    for (let k = 0; k < 3; k++) {
      const gs = (Math.imul(salt + 0x9E3779B9, 0x27D4EB2F) ^ Math.imul(k + 1, 0x85EBCA6B)) >>> 0;
      const desp = wa > wb ? "B" : (wb > wa ? "A" : null);
      const g = squadBattle(sqA, sqB, gs, desp);
      games.push(g);
      if (g.winnerSide === "A") wa++; else wb++;
      if (wa === 2 || wb === 2) break;
    }
    const winnerSide = (wa > wb) ? "A" : "B";
    return { games: games, count: games.length, scoreA: wa, scoreB: wb, winnerSide: winnerSide };
  }

  return {
    normalize: normalize, beastOf: beastOf, battle: battle, match: match,
    squadBattle: squadBattle, squadMatch: squadMatch, familyTag: familyTag, squadAura: squadAura,
    ELEMENTS: ELEMENTS, TRAITS: TRAITS, TEMPERS: TEMPERS, SYNERGY_DEFS: SYNERGY_DEFS,
    MOVE_KINDS: MOVE_KINDS, MOVE_KIND_NAME: MOVE_KIND_NAME, MOVE_KIND_DESC: MOVE_KIND_DESC,
    STAT_KEYS: STAT_KEYS, rankOf: rankOf, affinity: affinity
  };
})();
</script>
<script>
// src/kabu-core.js
// 株バトルの中核。設計書 §4（素体）・§5（状態）・§6（技）・§7.4（日替わり相手）。
//
// CB（対戦エンジン）と同じ書き方の自己完結 IIFE にしてある。ビルドでは index.html の中で
// CB の直後に並べて埋め込み、Node（sim / validate）では CB と一緒に評価する。つまり
// ブラウザと Node で同一のソースが動く（変換なし・一つの真実）。
//
// ここは「決算・株価・事業 → CB が食える個体」に翻訳するだけの純粋な計算に保つ。
// 通信・DOM・localStorage には触らない。
const KB = (function () {

  // ══════════════ 33 業種 → 五行 ══════════════
  // 設計書 §4.3 の覚え文「製造は素材に強く、素材は生活に強く、生活は情報に強く、
  // 情報は金融に強く、金融は製造に強い」を CB の affinity に写すと、"強い" は相克（d=2・×1.13）。
  // 連鎖が 2 つ飛びになるよう五行を割り当てると、本物の相克（木剋土・土剋水・水剋火・
  // 火剋金・金剋木）とちょうど一致する。語義も 土=素材 / 水=物流 / 火=半導体 / 金=金融 で噛み合う。
  const WOOD = 0, FIRE = 1, EARTH = 2, METAL = 3, WATER = 4;

  const SECTOR_ELEM = {
    // 木 — 製造・景気敏感
    "輸送用機器": WOOD, "機械": WOOD, "鉄鋼": WOOD, "非鉄金属": WOOD,
    "金属製品": WOOD, "精密機器": WOOD, "建設業": WOOD, "ゴム製品": WOOD,
    // 土 — 素材・エネルギー
    "化学": EARTH, "石油・石炭製品": EARTH, "鉱業": EARTH, "ガラス・土石製品": EARTH,
    "パルプ・紙": EARTH, "電気・ガス業": EARTH, "繊維製品": EARTH,
    // 水 — 生活・物流
    "食料品": WATER, "水産・農林業": WATER, "医薬品": WATER, "小売業": WATER,
    "卸売業": WATER, "サービス業": WATER, "陸運業": WATER, "海運業": WATER,
    "空運業": WATER, "倉庫・運輸関連業": WATER,
    // 火 — 情報・半導体
    "電気機器": FIRE, "情報・通信業": FIRE, "その他製品": FIRE,
    // 金 — 金融・不動産
    "銀行業": METAL, "証券、商品先物取引業": METAL, "保険業": METAL,
    "その他金融業": METAL, "不動産業": METAL
  };

  // 表記ゆれ（JPX の月次一覧・J-Quants・日経のページで中黒や「業」の有無が揺れる）
  const SECTOR_ALIAS = {
    "石油石炭製品": "石油・石炭製品", "石油・石炭": "石油・石炭製品", "石油石炭": "石油・石炭製品",
    "ガラス土石製品": "ガラス・土石製品", "ガラス・土石": "ガラス・土石製品",
    "パルプ紙": "パルプ・紙", "パルプ・紙製品": "パルプ・紙",
    "電気ガス業": "電気・ガス業", "電気・ガス": "電気・ガス業", "電気ガス": "電気・ガス業",
    "水産農林業": "水産・農林業", "水産・農林": "水産・農林業", "水産農林": "水産・農林業",
    "情報通信業": "情報・通信業", "情報・通信": "情報・通信業", "情報通信": "情報・通信業",
    "倉庫運輸関連業": "倉庫・運輸関連業", "倉庫・運輸関連": "倉庫・運輸関連業", "倉庫業": "倉庫・運輸関連業",
    "証券商品先物取引業": "証券、商品先物取引業", "証券・商品先物取引業": "証券、商品先物取引業",
    "証券業": "証券、商品先物取引業", "証券": "証券、商品先物取引業",
    "陸運": "陸運業", "海運": "海運業", "空運": "空運業",
    "銀行": "銀行業", "保険": "保険業", "その他金融": "その他金融業",
    "不動産": "不動産業", "建設": "建設業", "小売": "小売業", "卸売": "卸売業",
    "サービス": "サービス業", "鉱業業": "鉱業"
  };

  /** 業種名を JPX の 33 業種の正式名に寄せる */
  function normSector(s) {
    const t = String(s == null ? "" : s).trim();
    if (SECTOR_ELEM[t] != null) return t;
    if (SECTOR_ALIAS[t]) return SECTOR_ALIAS[t];
    return t;
  }

  /**
   * 業種 → 属性（0..4 = 木火土金水）。対応表に無い業種は水（生活・物流）に寄せる。
   * 設計書 §3 のとおり elem は機械的に決める（手で個別に変えない）。
   */
  function sectorElem(sector33) {
    const n = normSector(sector33);
    const e = SECTOR_ELEM[n];
    return e == null ? WATER : e;
  }

  /** 対応表に載っている 33 業種の一覧（validate / moves.json の網羅チェック用） */
  function sectors() { return Object.keys(SECTOR_ELEM); }

  // ══════════════ 数値のならし ══════════════
  function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }

  /** 対数で 0..1 に正規化。x が 0 以下・数でないときは 0 に落とす（赤字や欠損で壊れない） */
  function lognorm(x, lo, hi) {
    const v = Number(x);
    if (!isFinite(v) || v <= 0) return 0;
    return clamp((Math.log(v) - Math.log(lo)) / (Math.log(hi) - Math.log(lo)), 0, 1);
  }

  /** 0..1 → 24..100 の整数（CB のステータスと同じレンジ） */
  function S(v) { return Math.round(24 + 76 * clamp(v, 0, 1)); }

  const num = (x, d) => { const v = Number(x); return isFinite(v) ? v : (d === undefined ? 0 : d); };

  // ══════════════ 素体（決算 → ステータス）設計書 §4.2 ══════════════
  const OKU = 1e8, CHO = 1e12;   // 億・兆

  /**
   * 決算（TTM）と時価総額から 5 ステータスを作る。
   * 業種別の下駄は履かせない（設計書 §4.2: 金融は「守が低く見えるが体力が大きい」キャラになる）。
   * @param {object} fin  fin/<code>.json の TTM 部分
   * @param {number} mcap 時価総額（円）= 終値 × 発行済株式数
   */
  function baseStats(fin, mcap) {
    const f = fin || {};
    const sales = num(f.sales), op = num(f.op), ni = num(f.ni);
    const assets = num(f.assets), equity = num(f.equity), cash = num(f.cash);
    const eqRatio = num(f.eqRatio, assets > 0 ? equity / assets : 0);
    const liabilities = Math.max(1, assets - equity);
    const salesGrowth = num(f.salesGrowth);
    const opmStd = num(f.opmStd);
    const roe = equity > 0 ? ni / equity : 0;
    const opm = sales > 0 ? op / sales : 0;
    const turnover = assets > 0 ? sales / assets : 0;

    return {
      ATK: S(0.65 * lognorm(op, 10 * OKU, 5 * CHO) + 0.35 * clamp((salesGrowth + 0.10) / 0.40, 0, 1)),
      DEF: S(0.70 * clamp((eqRatio - 0.10) / 0.70, 0, 1) + 0.30 * lognorm(cash / liabilities, 0.02, 2.0)),
      SPD: S(clamp((turnover - 0.2) / 1.8, 0, 1)),
      TEC: S(clamp(opm / 0.45, 0, 1)),
      LUK: S(0.5 * clamp(roe / 0.30, 0, 1) + 0.5 * (1 - clamp(opmStd / 0.08, 0, 1)))
    };
  }

  /**
   * 体力（時価総額）。CB の maxHp は DEF/SPD/total から決まるので、時価総額ぶんは
   * `hpAdd` として個体に載せる。CB 側が hpAdd を見るようになるまでは無視されるだけで壊れない
   * （設計書 §0.1 の「エンジン改修は BarcodeTool 側に後方互換で入れる」に沿った拡張点）。
   * 体力そのものの表示値は hp（24..100）で図鑑に出す。
   */
  function bodyHp(mcap) {
    const v = lognorm(mcap, 200 * OKU, 40 * CHO);
    return { hp: S(v), hpAdd: Math.round(v * 320) };   // 大型株は +最大 320（素の maxHp ≒ 250..600 に対して効く量）
  }

  /**
   * 決算が無い間の暫定素体（設計書 §12 の最終行）。株価と出来高だけで埋める。
   * 決算が入った時点で baseStats に置き換わる。セーブには影響しない（素体は毎回計算）。
   */
  function provisionalStats(state) {
    const s = state || {};
    const close = num(s.close), vol = num(s.volume);
    const dev25 = num(s.dev25), ytdPos = num(s.ytdPos, 0.5), chgYtd = num(s.chgYtd);
    const volRatio = num(s.volRatio, 1);
    return {
      ATK: S(0.6 * clamp((chgYtd + 0.3) / 0.9, 0, 1) + 0.4 * lognorm(vol * close, 1 * OKU, 2000 * OKU)),
      DEF: S(0.6 * (1 - clamp(Math.abs(dev25) / 0.25, 0, 1)) + 0.4 * (1 - clamp(volRatio / 4, 0, 1))),
      SPD: S(clamp(volRatio / 3, 0, 1)),
      TEC: S(0.5 * clamp(ytdPos, 0, 1) + 0.5 * (1 - clamp(num(s.range) / 0.1, 0, 1))),
      LUK: S(clamp(num(s.range) / 0.08, 0, 1))
    };
  }

  // ══════════════ レア度（設計書 §4.4）══════════════
  // 閾値と売上の下限は、東証の内国株式 3,526 銘柄の実データで測り直した値（2026-09-26）。
  //
  // もとの式は下限 100 億円・閾値 0.85/0.72/0.58/0.44/0.30 だったが、実際の上場企業は
  // 売上の中央値が 339 億円・下位 25% が 99 億円以下で、**下位 4 分の 1 が全員 scale = 0** に
  // 潰れていた。結果、図鑑の 69% が D・S 以上は 20 銘柄しかいない、という分布になっていた。
  //
  // 下限を 10 億円に下げて小型株にも差を付け、閾値を実測の分位に合わせ直した結果:
  //   SS 1.0% / S 3.7% / A 8.5% / B 20.8% / C 31.5% / D 34.4%
  // 利益率に 0.4 を振る配分は変えていない（設計書 §4.4 の「小さくても利益率が異常に高い企業が
  // 食い込むように」という意図をそのまま残す）。実際キーエンス・信越化学・ディスコは SS、
  // 利益率 7% のトヨタは S になる。
  const RARE_STEPS = [[0.72, "SS"], [0.60, "S"], [0.50, "A"], [0.38, "B"], [0.26, "C"], [0, "D"]];
  const RARE_SALES_LO = 10 * OKU, RARE_SALES_HI = 30 * CHO;

  function rarityOf(fin) {
    const f = fin || {};
    const sales = num(f.sales), op = num(f.op);
    const scale = lognorm(sales, RARE_SALES_LO, RARE_SALES_HI);
    const quality = clamp((sales > 0 ? op / sales : 0) / 0.30, 0, 1);
    const rare = 0.6 * scale + 0.4 * quality;
    let label = "D";
    for (const [th, l] of RARE_STEPS) { if (rare >= th) { label = l; break; } }
    return { rare: rare, rareRank: label };
  }

  // ══════════════ 特性（設計書 §4.5）══════════════
  // 決算の事実から決定論的に付ける。1 体 1〜2 個。CB の個体は trait ひとつなので、
  // 1 個目を trait（前衛で本発動）、2 個目を traitKeys の 2 番目（隊のオーラ計算で使う）に置く。
  const TRAIT_RULES = [
    { key: "calc", test: (f) => f.opm >= 0.25, why: "営業利益率 25% 以上（高付加価値）" },
    { key: "wall", test: (f) => f.eqRatio >= 0.60, why: "自己資本比率 60% 以上（無借金体質）" },
    { key: "fang", test: (f) => f.salesGrowth >= 0.15, why: "売上成長率 15% 以上（成長企業）" },
    { key: "curse", test: (f) => f.ni < 0, why: "純利益が赤字（追い詰められた者の逆襲）" },
    { key: "regen", test: (f) => f.divYield >= 0.035, why: "配当利回り 3.5% 以上（株主還元）" },
    { key: "luck", test: (f) => f.opmStd >= 0.06, why: "直近 4 期の利益のブレが大きい（業績が読めない）" },
    { key: "focus", test: (f) => f.turnover >= 1.5, why: "総資産回転率 1.5 以上（身軽）" },
    { key: "serene", test: (f) => f.mcapTop10, why: "時価総額 上位 10（大御所）" }
  ];

  // どの条件にも当たらなかった銘柄の予備。いつも同じ特性になると図鑑が単調になるので、
  // その銘柄が一番得意なステータスに沿った特性を付ける（これも決算から決まる＝決定論）。
  const FALLBACK_BY_STAT = {
    ATK: { key: "fang", why: "攻めが持ち味（利益の絶対額が大きい）" },
    DEF: { key: "wall", why: "守りが持ち味（財務が厚い）" },
    SPD: { key: "swift", why: "速さが持ち味（資産を素早く回す）" },
    TEC: { key: "focus", why: "技が持ち味（利益率で稼ぐ）" },
    LUK: { key: "luck", why: "運が持ち味（安定した収益）" }
  };

  /** @returns {{keys:string[], notes:Array<{key:string,why:string}>}} */
  function traitsOf(fin, state, opt) {
    const f = fin || {}, s = state || {}, o = opt || {};
    const sales = num(f.sales);
    const facts = {
      opm: sales > 0 ? num(f.op) / sales : 0,
      eqRatio: num(f.eqRatio, num(f.assets) > 0 ? num(f.equity) / num(f.assets) : 0),
      salesGrowth: num(f.salesGrowth),
      ni: num(f.ni),
      divYield: num(s.close) > 0 ? num(f.div) / num(s.close) : 0,
      opmStd: num(f.opmStd),
      turnover: num(f.assets) > 0 ? sales / num(f.assets) : 0,
      mcapTop10: !!o.mcapTop10
    };
    const notes = [];
    for (const r of TRAIT_RULES) {
      if (r.test(facts)) notes.push({ key: r.key, why: r.why });
      if (notes.length >= 2) break;
    }
    if (!notes.length) {
      const st = o.stats;
      let best = "ATK";
      if (st) for (const k of CB.STAT_KEYS) if (st[k] > st[best]) best = k;
      notes.push(FALLBACK_BY_STAT[best]);
    }
    return { keys: notes.map((n) => n.key), notes: notes };
  }

  // ══════════════ 技（設計書 §6）══════════════
  // 設計書 §6.2 は 18 種の kind を並べているが、CB の現行エンジンが実際に効かせるのは
  // strike / crit / pierce / drain / finisher の 5 種だけ。そこで moves.json には設計どおりの
  // 豊かな kind を書いておき、ここで「今のエンジンで一番近い挙動」に落とす。
  // CB 側に kind を足したらこの表から順に外していけばよい（moves.json は書き換えなくて済む）。
  const ENGINE_KINDS = { strike: 1, crit: 1, pierce: 1, drain: 1, finisher: 1 };
  const KIND_FALLBACK = {
    multi: "strike",    // 連撃 → 素直な一撃（回数は未実装）
    sure: "strike",     // 必中
    first: "strike",    // 次ターン先手
    stack: "strike",    // 使うたび攻 +N
    gamble: "crit",     // 威力 0〜N 倍 → 会心寄り
    delay: "finisher",  // 溜めて大ダメージ → 瀕死時の大技
    shield: "strike",   // 被ダメ −N%
    reflect: "strike",  // 反射
    swap: "pierce",     // 攻守入れ替え → 守り無視で近似
    dot: "drain",       // 継続ダメージ → 吸収で近似
    debuff: "pierce",   // 守/速/攻 −N% → 守り無視で近似
    heal: "drain",      // 回復
    counter: "strike"   // 回避専念して反撃
  };

  /** moves.json の kind を、今のエンジンが実際に効かせる kind に落とす */
  function engineKind(kind) {
    const k = String(kind || "strike");
    if (ENGINE_KINDS[k]) return k;
    return KIND_FALLBACK[k] || "strike";
  }

  /**
   * 技の属性。moves.json が elem を持っていればそれ、無ければコードから決定論的に散らす。
   * 1 本目（業種技）は必ず自分の属性（十八番）、2 本目以降はカバー技になり得る。
   * CB の chooseMove は「相手の属性に一番有利な技」を自動で選ぶので、これが相性の受け皿になる。
   */
  function moveElem(spec, ownElem, code, i) {
    if (spec && spec.elem != null) {
      const e = typeof spec.elem === "number" ? spec.elem : sectorElem(spec.elem);
      return ((e % 5) + 5) % 5;
    }
    if (i === 0) return ownElem;
    return (ownElem + 1 + (hashStr(code + ":mv" + i) % 4)) % 5;
  }

  /**
   * 1 銘柄の技 4 枠（業種技・固有技 1・固有技 2・必殺技）を組む。設計書 §6.1。
   * 必殺技は解放条件を満たした日だけ混ぜる（§6.4）。固有技が無い銘柄は業種技だけで戦える。
   */
  function movesFor(movesJson, u, ownElem, code, unlocked) {
    const mj = movesJson || {};
    const out = [];
    const sectorMove = (mj.sector || {})[normSector(u && u.sector33)];
    if (sectorMove) out.push(toMove(sectorMove, ownElem, code, 0));

    const entry = (mj.stocks || {})[code] || {};
    const own = Array.isArray(entry.moves) ? entry.moves : [];
    own.slice(0, 2).forEach((m, i) => out.push(toMove(m, ownElem, code, i + 1)));

    // 固有技が無い銘柄は業種技で代用する（設計書 §6.3）。ここで**技を 3 本に揃える**のが大事で、
    // エンジンの chooseMove は「相手の属性に一番有利な技」を選ぶので、技が 2 本だと 5 属性のうち
    // 2 つしかカバーできず、相手の属性しだいで勝敗が決まりすぎる（実測で相克側の勝率 66.5%＝
    // 有利・不利の差 33 ポイント）。BarcodeTool 側も v3 で「カバー技を持たせると属性差が
    // 45 → 15 ポイントに縮む」と記録している。moveElem が本数ごとに別の属性を割り当てるので、
    // 同じ業種技を足すだけでカバー範囲が広がる。
    if (!own.length && sectorMove) {
      out.push(toMove(sectorMove, ownElem, code, 1));
      out.push(toMove(sectorMove, ownElem, code, 2));
    } else if (own.length === 1 && sectorMove) {
      out.push(toMove(sectorMove, ownElem, code, 2));
    }

    const ult = entry.ultimate;
    if (ult && isUnlocked(ult, unlocked)) out.push(toMove(ult, ownElem, code, 3, true));

    if (!out.length) out.push({ elem: ownElem, element: elementOf(ownElem), kind: "strike", name: "様子見", text: "手をこまねいて一撃", origin: "", designKind: "strike" });
    return out;
  }

  function toMove(spec, ownElem, code, i, isUlt) {
    const elem = moveElem(spec, ownElem, code, i);
    const designKind = String(spec.kind || "strike");
    // 必殺技は「瀕死のときだけ出る大技」としてエンジンに見せたい枠なので finisher に寄せる
    const kind = isUlt ? (ENGINE_KINDS[designKind] === 1 && designKind !== "strike" ? designKind : "finisher") : engineKind(designKind);
    return {
      elem: elem, element: elementOf(elem), kind: kind,
      name: String(spec.name || "一撃"),
      text: String(spec.text || ""), origin: String(spec.origin || ""),
      designKind: designKind, ultimate: !!isUlt
    };
  }

  /** 必殺技の解放（設計書 §6.4）。unlock のどれか 1 つでも当日成立していれば解放 */
  function isUnlocked(ult, unlocked) {
    const need = Array.isArray(ult.unlock) ? ult.unlock : [];
    if (!need.length) return true;
    const u = unlocked || {};
    return need.some((k) => !!u[k]);
  }

  function elementOf(i) { return CB.ELEMENTS[((i % 5) + 5) % 5]; }

  // ══════════════ 決算発表日の推定（設計書 §2・§9.3）══════════════
  // 決算発表予定日は J-Quants の /fins/announcement から取る前提だったが、そこへは届かない（§14.2）。
  // 設計書 §2 自身が「取れない銘柄は前回発表日 + 3 か月で推定し estimated:true」と定めているので、
  // 決算期末（fin.fiscalId = "2026-06-30" のような四半期末）からの経過日数で推定する。
  //
  // 日本の上場企業は四半期末からおおむね 30〜45 日で開示する。中央あたりの 40 日を採る。
  // これが無いと、必殺技の解放条件 `earnings` が一度も成立せず（実測で 136 本中 110 本が
  // earnings を条件に挙げている）、決算日ボス（§9.3）も永久に出ない。
  // 決算短信の開示は法令上「四半期末から 45 日以内」で、実際は 35〜45 日に集中する。
  // その帯をそのまま「決算日（推定）」とする。
  const EARNINGS_FROM = 35, EARNINGS_TO = 45;

  // 肝心なのは **fiscalId を「直近の四半期末」ではなく「ある期末」として読む**こと。
  // 取得元は銘柄によって四半期を配信しておらず、実測では 3,693 銘柄中 2,288 銘柄（62%）の
  // fiscalId が年度末（2026-03-31）で止まっていた。「fiscalId + 40 日」だけで見ると、
  // この 62% は年 1 回しか決算日が立たない。
  //
  // どちらの場合も fiscalId は四半期の格子の上に乗っているので、そこから 3 か月刻みで
  // 前後に伸ばせば、四半期末しか取れない銘柄でも年 4 回の発表日が出る。
  // 3 月期末の会社なら 3/31・6/30・9/30・12/31 → 5 月上旬・8 月上旬・11 月上旬・2 月上旬。
  // 5 月期末の会社ならその会社の暦で 4 回。判定は (日付, fiscalId) だけで決まるので、
  // 焼き込み（latest.json）と再計算（validate）は必ず一致する（§14.4.2）。

  const dayMs = 86400000;
  function parseDate(s) {
    const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(s || ""));
    return m ? Date.UTC(+m[1], +m[2] - 1, +m[3]) : NaN;
  }
  const fmtDate = (t) => new Date(t).toISOString().slice(0, 10);

  /** ある期末から 3 か月刻みで伸ばした四半期末のうち、date の直前にくるもの */
  function quarterEndBefore(date, fiscalId) {
    const f = parseDate(fiscalId), d = parseDate(date);
    if (!isFinite(f) || !isFinite(d)) return NaN;
    const fd = new Date(f), dd = new Date(d);
    // fiscalId は月末なので「その月の月末」として 3 か月刻みで動かす
    const fy = fd.getUTCFullYear(), fm = fd.getUTCMonth();
    const monthsApart = (dd.getUTCFullYear() - fy) * 12 + (dd.getUTCMonth() - fm);
    // date 以前で一番近い四半期末を探す（境目で取りこぼさないよう 1 つ手前から見る）
    let best = NaN;
    for (let k = Math.floor(monthsApart / 3) + 1; k >= Math.floor(monthsApart / 3) - 2; k--) {
      const m = fm + k * 3;
      const end = Date.UTC(fy + Math.floor(m / 12), (m % 12 + 12) % 12 + 1, 0);  // その月の末日
      if (end <= d && (!isFinite(best) || end > best)) best = end;
    }
    return best;
  }

  /**
   * 決算期末 → 発表日（推定）の帯。取れないときは null。
   * @returns {{from:string, to:string}|null}
   */
  function estimatedEarningsDate(fiscalId, onDate) {
    const q = quarterEndBefore(onDate || fiscalId, fiscalId);
    if (!isFinite(q)) return null;
    return { from: fmtDate(q + EARNINGS_FROM * dayMs), to: fmtDate(q + EARNINGS_TO * dayMs) };
  }

  /**
   * その日が「決算日」か（推定）。四半期ごとに 1 回、35〜45 日目の帯で立つ。
   * @param {string} date     latest.json の日付
   * @param {string} fiscalId その銘柄の決算期末（fin.fiscalId）
   */
  function isEarningsDay(date, fiscalId) {
    const q = quarterEndBefore(date, fiscalId);
    if (!isFinite(q)) return false;
    const d = parseDate(date);
    return d >= q + EARNINGS_FROM * dayMs && d <= q + EARNINGS_TO * dayMs;
  }

  // ══════════════ ハッシュ（決定論の種）══════════════
  // 日次処理の乱数シードは hash(date, code)（設計書 §7.1）。いつ開いても同じ結果になる。
  function hashStr(s) {
    let h = 0x811c9dc5;
    const str = String(s == null ? "" : s);
    for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 0x01000193) >>> 0; }
    return h >>> 0;
  }
  function dayHash(code, date) { return hashStr(String(date) + "|" + String(code)); }

  // ══════════════ 個体（CB が食える形）══════════════
  /**
   * 銘柄 → CB の個体。戻り値の形は CB.beastOf() の戻り値と互換にして、
   * battle / squadBattle / squadAura に無改造で渡せるようにする（設計書 §10）。
   *
   * @param {object} a
   * @param {string} a.code    証券コード（ID。社名や業種が変わっても不変）
   * @param {object} a.u       universe.json の 1 銘柄
   * @param {object} a.fin     決算（TTM）。無ければ暫定素体になる
   * @param {object} a.state   latest.json の 1 銘柄（今日の状態）
   * @param {object} a.moves   moves.json 全体
   * @param {string} a.date    latest.json の日付（決定論の種）
   * @param {object} [a.unlocked] 必殺技の解放状況 {awaken,limitUp,earnings,streak}
   * @param {boolean} [a.mcapTop10]
   */
  function buildFromStock(a) {
    const code = String(a.code);
    const u = a.u || {};
    const state = a.state || {};
    const fin = a.fin || null;
    const date = String(a.date || "");

    const elem = u.elem != null && typeof u.elem === "number" ? u.elem : sectorElem(u.sector33);
    const shares = num(fin && fin.shares);
    const mcap = shares > 0 ? num(state.close) * shares : num(state.mcap);

    const stats = fin ? baseStats(fin, mcap) : provisionalStats(state);
    const body = bodyHp(mcap > 0 ? mcap : num(state.close) * 1e8);
    const { rare, rareRank } = fin ? rarityOf(fin) : { rare: 0.35, rareRank: "C" };
    const tr = traitsOf(fin, state, { mcapTop10: !!a.mcapTop10, stats: stats });
    const traitObj = CB.TRAITS.find((t) => t.key === tr.keys[0]) || CB.TRAITS[0];

    let sum = 0;
    for (const k of CB.STAT_KEYS) sum += stats[k];
    const total = Math.round(sum / 5);

    const name = String(u.name || code);
    const hash = dayHash(code, date);

    return {
      // ── CB が読むフィールド（形は CB.beastOf の戻り値と同じ）──
      code: code, name: name, sid: code,
      prefixWord: "", suffixWord: name,
      stats: stats, sum: sum, total: total, rank: CB.rankOf(total),
      elem: elem, element: elementOf(elem),
      temper: "", trait: traitObj, hash: hash,
      moves: movesFor(a.moves, u, elem, code, a.unlocked),
      // ── 株バトル固有（CB は無視する。図鑑と精算で使う）──
      hpAdd: body.hpAdd,          // CB 側が対応したら maxHp に足される（未対応なら無視されるだけ）
      kabu: {
        hp: body.hp, mcap: mcap, rare: rare, rareRank: rareRank,
        sector33: normSector(u.sector33), short: String(u.short || name),
        traitKeys: tr.keys, traitNotes: tr.notes,
        provisional: !fin, date: date,
        stale: num(state.stale), suspect: !!state.suspect
      }
    };
  }

  // ══════════════ 状態（株価 → 今日のコンディション）設計書 §5.1 ══════════════
  // すべて「素体に対する係数」。素体は書き換えない。係数の積は 0.75〜1.35 に clamp する
  // （状態が素体を覆い尽くさない＝「学べば読める」を守る）。
  const MOD_LO = 0.75, MOD_HI = 1.35;

  /**
   * @param {object} state  latest.json の 1 銘柄
   * @param {object} market {nk225Chg, marketOpen}
   * @param {object} [extra] {predict:"up"|"down"|"flat"|null, hit:boolean|null, streak:number, earnings:boolean, exDiv:boolean, divYield:number}
   */
  function stateMods(state, market, extra) {
    const s = state || {}, m = market || {}, x = extra || {};
    const mods = {
      ATK: 1, DEF: 1, SPD: 1, TEC: 1, LUK: 1,
      hpMul: 1, order: 0, critAdd: 0, spreadAdd: 0, takenMul: 1,
      stunFirst: false, unlocked: {}, tags: []
    };
    const tag = (t) => mods.tags.push(t);

    // 消息不明（stale ≥ 3）は状態係数をすべて 1.0（素体のまま）
    if (num(s.stale) >= 3) { tag("消息不明"); return mods; }

    const chg1 = num(s.chg1), ytdPos = num(s.ytdPos, 0.5), chgYtd = num(s.chgYtd);
    const volRatio = num(s.volRatio, 1), range = num(s.range), dev25 = num(s.dev25);

    // テンション: 上げた日は攻寄り、下げた日は守寄り（合計は概ね保存＝強弱ではなく配分）
    const t = clamp(chg1, -0.08, 0.08);
    mods.ATK *= (1 + t * 1.5);
    mods.DEF *= (1 - t * 1.0);
    if (Math.abs(chg1) >= 0.02) tag(chg1 > 0 ? "テンション（攻寄り）" : "テンション（守寄り）");

    if (ytdPos >= 0.9) {                       // 覚醒
      for (const k of CB.STAT_KEYS) mods[k] *= 1.06;
      mods.unlocked.awaken = true; tag("覚醒");
    }
    if (ytdPos <= 0.1) {                       // 逆境
      mods.hpMul *= 0.90; mods.critAdd += 0.08; tag("逆境");
    }
    mods.order += clamp(chgYtd, -0.3, 0.3) * 20;                       // 勢い
    mods.ATK *= clamp(0.9 + 0.1 * volRatio, 0.9, 1.25);                // 注目
    if (volRatio >= 2) tag("注目");
    mods.spreadAdd += clamp(range * 2, 0, 0.12);                       // 荒れ
    if (range >= 0.05) tag("荒れ");

    if (dev25 >= 0.12) { mods.ATK *= 1.12; mods.DEF *= 0.85; tag("暴走"); }
    if (dev25 <= -0.12) { mods.SPD *= 0.85; mods.DEF *= 1.12; tag("冬眠"); }

    const per = num(s.per), pbr = num(s.pbr), sPer = num(s.sectorPer);
    if (sPer > 0 && per > 0 && per < sPer * 0.7 && pbr > 0 && pbr < 1) { mods.takenMul *= 0.92; tag("粘り"); }
    if (sPer > 0 && per > sPer * 1.5) { mods.order += 10; mods.takenMul *= 1.08; tag("期待"); }

    if (s.limitUp) { mods.unlocked.limitUp = true; mods.critAdd += 0.10; tag("ストップ高"); }
    if (s.limitDown) { mods.stunFirst = true; tag("ストップ安"); }

    const nk = num(m.nk225Chg);
    if (nk <= -0.03) { mods.DEF *= 0.90; tag("暴落の日"); }
    if (nk >= 0.03) { mods.ATK *= 1.05; tag("祭りの日"); }

    if (x.earnings) { mods.unlocked.earnings = true; tag("決算日"); }
    if (x.exDiv) { mods.hpMul *= (1 - clamp(num(x.divYield) * 2, 0, 0.10)); tag("配当落ち"); }
    if (num(x.streak) >= 3) { mods.unlocked.streak = true; tag("予想 3 連勝"); }

    // 予想（設計書 §7.3）
    if (x.hit === true) { mods.critAdd += 0.06; tag("予想的中"); }
    if (x.hit === false) { mods.order -= 15; tag("予想外れ"); }

    for (const k of CB.STAT_KEYS) mods[k] = clamp(mods[k], MOD_LO, MOD_HI);
    mods.hpMul = clamp(mods.hpMul, MOD_LO, MOD_HI);
    mods.takenMul = clamp(mods.takenMul, MOD_LO, MOD_HI);
    return mods;
  }

  /**
   * 状態係数を個体に乗せて「今日のその銘柄」を作る。素体（引数）は変更しない。
   * 返り値も CB 互換なので、そのまま squadBattle に渡せる。
   */
  function applyMods(beast, mods) {
    const stats = {};
    for (const k of CB.STAT_KEYS) stats[k] = clamp(Math.round(beast.stats[k] * mods[k]), 1, 130);
    let sum = 0; for (const k of CB.STAT_KEYS) sum += stats[k];
    const total = Math.round(sum / 5);
    // 行動順・会心・振れ・被ダメはエンジンが個体から読まないので、SPD/LUK に寄せて表現する。
    // （CB に mods をそのまま渡せるようになったらこの寄せは外せる）
    if (mods.order) stats.SPD = clamp(Math.round(stats.SPD + mods.order * 0.3), 1, 130);
    if (mods.critAdd) stats.LUK = clamp(Math.round(stats.LUK + mods.critAdd * 100 * 0.6), 1, 130);
    return Object.assign({}, beast, {
      stats: stats, sum: sum, total: total, rank: CB.rankOf(total),
      hpAdd: Math.round(num(beast.hpAdd) * mods.hpMul),
      kabu: Object.assign({}, beast.kabu, { mods: mods, tags: mods.tags })
    });
  }

  // ══════════════ 日替わり相手（設計書 §7.4）══════════════
  // 収録が東証の内国株式すべて（約 3,500 銘柄）になったので、素の「値上がり率 1 位」は
  // ほぼ毎日、数百円の超小型株がストップ高を付けたもので埋まる。それでは「その日の相場そのもの」
  // という趣旨から外れる（誰も知らない会社ばかりが毎日ボスになる）ので、時価総額の下限だけ置く。
  // 下限で候補が 3 体に足りなくなったら下限を外す＝主役が出せない日を作らない。
  const MIN_MCAP = 100 * OKU;

  /**
   * 「その日の相場そのもの」を相手にする。値上がり率 1 位・値下がり率 1 位・出来高比 1 位。
   * 同一銘柄が複数枠に来たら次点に送る。並べ替えは決定論（同値はコード順）。
   * @param {object} latest
   * @param {{minMcap?:number}} [opt] minMcap に 0 を渡すと設計書どおりの素の挙動になる
   */
  function protagonists(latest, opt) {
    const minMcap = opt && opt.minMcap != null ? num(opt.minMcap) : MIN_MCAP;
    const all = Object.entries((latest && latest.stocks) || {})
      .filter(([, s]) => num(s.stale) < 3 && !s.suspect);
    // 時価総額が入っていない銘柄（決算未取得）は下限の判定ができないので落とさない
    const liquid = all.filter(([, s]) => !(num(s.mcap) > 0) || num(s.mcap) >= minMcap);
    const rows = (liquid.length >= 3 ? liquid : all)
      .map(([code, s]) => ({ code: code, chg1: num(s.chg1), volRatio: num(s.volRatio, 1) }));
    const pick = (sortFn) => rows.slice().sort(sortFn).map((r) => r.code);
    const up = pick((a, b) => b.chg1 - a.chg1 || (a.code < b.code ? -1 : 1));
    const down = pick((a, b) => a.chg1 - b.chg1 || (a.code < b.code ? -1 : 1));
    const hot = pick((a, b) => b.volRatio - a.volRatio || (a.code < b.code ? -1 : 1));

    const used = Object.create(null);
    const take = (list) => { for (const c of list) { if (!used[c]) { used[c] = 1; return c; } } return null; };
    return { up: take(up), down: take(down), hot: take(hot) };
  }

  /** 相手の強さを自パーティに合わせて素体を ±10% でスケール（設計書 §7.4 の梯子方式） */
  function scaleToParty(beast, myAvgRare, theirRare) {
    const d = clamp((num(myAvgRare) - num(theirRare)) * 0.5, -0.10, 0.10);
    const stats = {};
    for (const k of CB.STAT_KEYS) stats[k] = clamp(Math.round(beast.stats[k] * (1 + d)), 1, 130);
    let sum = 0; for (const k of CB.STAT_KEYS) sum += stats[k];
    const total = Math.round(sum / 5);
    return Object.assign({}, beast, { stats: stats, sum: sum, total: total, rank: CB.rankOf(total) });
  }

  // ══════════════ 株式分割・併合の検出（設計書 §8.3）══════════════
  // 日足の提供元は分割調整済みの系列を出すが、当日〜翌日は未調整で来ることがある。
  // 未調整の日は前日比が 1/n-1（分割）か n-1（併合）に張り付くので、出来高の跳ねと
  // 併せて検出する。検出した日は「テンション」「荒れ」の判定を無効化し、契約中の口数を調整する。
  const SPLIT_RATIOS = [2, 3, 4, 5, 10];

  /**
   * @param {number} chg1     前日比（close/prevClose - 1）
   * @param {number} volume   当日の出来高
   * @param {number} avgVolume 平時（20 日平均）の出来高
   * @param {number} [tol]    許容誤差（既定 ±2%）
   * @returns {{kind:"split"|"merge", n:number}|null}
   */
  function detectSplit(chg1, volume, avgVolume, tol) {
    const c = num(chg1), v = num(volume), av = num(avgVolume);
    const eps = num(tol, 0.02) || 0.02;
    if (!(av > 0) || !(v >= av * 3)) return null;   // 出来高が平時の 3 倍以上でなければ見送る
    for (const n of SPLIT_RATIOS) {
      if (Math.abs(c - (1 / n - 1)) <= eps) return { kind: "split", n: n };
      if (Math.abs(c - (n - 1)) <= eps) return { kind: "merge", n: n };
    }
    return null;
  }

  /**
   * 契約中の口数と取得単価を分割・併合で調整する（設計書 §8.3。資金価値は保存される）。
   * @param {{units:number, cost:number}} holding
   */
  function adjustHolding(holding, ev) {
    const h = holding || { units: 0, cost: 0 };
    if (!ev) return { units: num(h.units), cost: num(h.cost) };
    const r = ev.kind === "split" ? ev.n : 1 / ev.n;
    return { units: num(h.units) * r, cost: num(h.cost) / r };
  }

  // ══════════════ パーティ（CB の squad 形）══════════════
  /** 属性がばらけると共鳴（設計書 §7.2）。CB.squadAura の reso に渡す形に寄せる */
  function squadOf(beasts) {
    const elems = beasts.map((b) => b.elem);
    const uniq = new Set(elems).size;
    return {
      beasts: beasts,
      mastery: beasts.map(() => 0),
      reso: { family: uniq === 1, session: false },
      spread: uniq >= 3
    };
  }

  return {
    // 業種・属性
    WOOD: WOOD, FIRE: FIRE, EARTH: EARTH, METAL: METAL, WATER: WATER,
    SECTOR_ELEM: SECTOR_ELEM, sectors: sectors, sectorElem: sectorElem, normSector: normSector,
    // 素体
    lognorm: lognorm, S: S, baseStats: baseStats, bodyHp: bodyHp, provisionalStats: provisionalStats,
    rarityOf: rarityOf, traitsOf: traitsOf, TRAIT_RULES: TRAIT_RULES, FALLBACK_BY_STAT: FALLBACK_BY_STAT,
    // 技
    engineKind: engineKind, KIND_FALLBACK: KIND_FALLBACK, movesFor: movesFor, isUnlocked: isUnlocked,
    // 決算発表日（推定）
    estimatedEarningsDate: estimatedEarningsDate, isEarningsDay: isEarningsDay,
    EARNINGS_FROM: EARNINGS_FROM, EARNINGS_TO: EARNINGS_TO, quarterEndBefore: quarterEndBefore,
    // 個体
    buildFromStock: buildFromStock, hashStr: hashStr, dayHash: dayHash,
    // 状態
    stateMods: stateMods, applyMods: applyMods, MOD_LO: MOD_LO, MOD_HI: MOD_HI,
    // 分割・併合
    SPLIT_RATIOS: SPLIT_RATIOS, detectSplit: detectSplit, adjustHolding: adjustHolding,
    // 対戦
    protagonists: protagonists, MIN_MCAP: MIN_MCAP, scaleToParty: scaleToParty, squadOf: squadOf
  };
})();

</script>
<script>
"use strict";
(function () {

// ══════════════ セーブ（端末内）══════════════
// 設計書 §0 の柱 6: localStorage ＋ JSON 書き出し。スキーマは版番号を持ち、旧版を 1 世代残す。
// §8.6 の約束: キーは kabu_battle_v1 のまま、フィールドは追加だけ。
// 新しいフィールドが無い古いセーブを読んでも落ちないこと（loadStore で 1 つずつ確かめて写す）。
var SAVE_KEY = "kabu_battle_v1";
var INITIAL_CASH = 300000;

function blankSeason(id) {
  return {
    id: id || "",       // "YYYY-MM"（月＝1 シーズン。設計書 §7.5）
    days: 0, wins: 0, losses: 0, draws: 0, points: 0,
    hits: 0, misses: 0, gain: 0, best: 0,
    sells: 0,           // 手放した回数（塩漬けの判定）
    hotDays: 0,         // 出来高が跳ねた銘柄を連れて戦った日数
    divDays: 0,         // 配当利回りの高い銘柄を連れて戦った日数
    spreadDays: 0,      // 3 属性ばらばらで戦った日数
    focusDays: 0,       // 同属性 3 体で戦った日数
    comebacks: 0,       // 逆境の銘柄を抱えて勝った日数
    peakAssets: 0       // そのシーズンの総資産の最高値
  };
}

function blankStore() {
  return {
    v: 1,
    cash: INITIAL_CASH,
    holdings: {},          // code -> {units, cost, last}  cost = 1 口あたりの取得単価／last = 最後に見た終値
    party: ["", "", ""],   // 前衛・中衛・後衛
    settledTo: "",         // ここまでの営業日は精算済み
    predict: {},           // "YYYY-MM-DD" -> { code: "up"|"down"|"flat" }
    streak: {},            // code -> 予想の連勝数
    results: [],           // 直近の精算結果（新しい順・最大 60 件）
    stats: { days: 0, wins: 0, losses: 0, hits: 0, misses: 0, best: 0, streak: 0 },
    seenIntro: false,
    // ── ここから下は後から足したフィールド。古いセーブには無い（無くても動く）──
    delisted: [],          // 旅立ち（上場廃止で自動的に手放した記録。設計書 §8.4）
    titles: [],            // 獲得した称号（永続。設計書 §7.5）
    seasons: [],           // 過去シーズンの成績（軽量）
    season: blankSeason("")// 今のシーズンの途中経過
  };
}

var store = blankStore();

function loadStore() {
  try {
    var raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return;
    var j = JSON.parse(raw);
    if (!j || j.v !== 1) return;
    var s = blankStore();
    s.cash = num(j.cash, INITIAL_CASH);
    if (j.holdings && typeof j.holdings === "object") {
      for (var c in j.holdings) {
        var h = j.holdings[c];
        var units = Math.max(0, num(h && h.units, 0));
        if (units > 0) {
          s.holdings[c] = { units: units, cost: Math.max(0, num(h.cost, 0)) };
          if (isFinite(num(h.last, NaN))) s.holdings[c].last = num(h.last);
        }
      }
    }
    if (Array.isArray(j.party)) s.party = [0, 1, 2].map(function (i) { return typeof j.party[i] === "string" ? j.party[i] : ""; });
    if (typeof j.settledTo === "string") s.settledTo = j.settledTo;
    if (j.predict && typeof j.predict === "object") s.predict = j.predict;
    if (j.streak && typeof j.streak === "object") s.streak = j.streak;
    if (Array.isArray(j.results)) s.results = j.results.slice(0, 60);
    if (j.stats && typeof j.stats === "object") Object.assign(s.stats, j.stats);
    s.seenIntro = !!j.seenIntro;
    // 追加フィールド（古いセーブには無い）
    if (Array.isArray(j.delisted)) {
      s.delisted = j.delisted.filter(function (d) { return d && d.code; }).slice(0, 200);
    }
    if (Array.isArray(j.titles)) {
      s.titles = j.titles.filter(function (t) { return t && t.key; }).slice(0, 100);
    }
    if (Array.isArray(j.seasons)) s.seasons = j.seasons.filter(function (x) { return x && x.id; }).slice(-36);
    if (j.season && typeof j.season === "object") Object.assign(s.season, j.season);
    store = s;
  } catch (e) { /* 壊れたセーブは無視して初期状態で始める（落とさない） */ }
}

function saveStore() {
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(store)); } catch (e) {}
}

// ══════════════ 小物 ══════════════
function num(v, d) { var n = Number(v); return isFinite(n) ? n : (d === undefined ? 0 : d); }
function $(id) { return document.getElementById(id); }
function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}
function yen(v) { return Math.round(num(v)).toLocaleString("ja-JP"); }
function pct(v, digits) { var n = num(v) * 100; return (n >= 0 ? "+" : "") + n.toFixed(digits === undefined ? 2 : digits) + "%"; }
function cls(v) { return v > 0 ? "up" : v < 0 ? "down" : ""; }
function elClass(i) { return "el el" + i; }
// 併合で口数が割り切れないことがあるので、端数があるときだけ小数を出す
function units(v) {
  var n = num(v);
  return Math.abs(n - Math.round(n)) < 1e-9 ? String(Math.round(n)) : n.toFixed(2);
}

// ══════════════ データ ══════════════
var D = { universe: null, latest: null, moves: null, index: null, daily: {} };

function loadJson(path) {
  return fetch(path, { cache: "no-cache" }).then(function (r) {
    if (!r.ok) throw new Error(path + " が読めません（" + r.status + "）");
    return r.json();
  });
}

function stockOf(code) { return (D.universe.stocks || {})[code] || null; }
function stateOf(code, day) { return ((day || D.latest).stocks || {})[code] || null; }

// 決算の内訳は「図鑑のカードを開いたときにその 1 銘柄だけ」取りに行く（設計書 §9.2）。
// 全銘柄ぶん先読みすると数千リクエストになるので、起動時には触らない。
// 素体（5 ステータス・レア度・特性）は latest.json に焼き込まれた値を使う（下の bakeOver）。
var finCache = Object.create(null);     // code -> ttm または null（一度試したら覚える）
var finPending = Object.create(null);   // 取りに行っている途中のもの（同じ銘柄を二度取りに行かない）
function loadFin(code) {
  if (code in finCache) return Promise.resolve(finCache[code]);
  if (finPending[code]) return finPending[code];
  finPending[code] = loadJson("kabu/data/fin/" + code + ".json").then(function (j) {
    return (j && j.ttm) ? j.ttm : null;
  }).catch(function () { return null; }).then(function (ttm) {
    finCache[code] = ttm; delete finPending[code];
    return ttm;
  });
  return finPending[code];
}

// 時価総額の上位 10（特性 serene の判定に使う。焼き込みが無いときの予備経路でだけ効く）
var top10 = Object.create(null);
function computeTop10() {
  var rows = Object.keys(D.latest.stocks || {}).map(function (c) {
    return { c: c, m: num(D.latest.stocks[c].mcap) };
  }).sort(function (a, b) { return b.m - a.m; }).slice(0, 10);
  top10 = Object.create(null);
  rows.forEach(function (r) { top10[r.c] = true; });
}

/**
 * latest.json に焼き込まれた素体を個体に載せる。
 * データ層が stats / hp / hpAdd / rare / rareRank / traitKeys / provisional を焼き込む前提だが、
 * まだ焼き込まれていない latest.json でも動くよう、無ければ組み立てた値のままにする。
 */
function bakeOver(b, st) {
  if (!b || !st || !st.stats) return b;
  var stats = {}, ok = true;
  CB.STAT_KEYS.forEach(function (k) {
    var v = Number(st.stats[k]);
    if (!isFinite(v)) ok = false; else stats[k] = Math.round(v);
  });
  if (!ok) return b;
  var sum = 0;
  CB.STAT_KEYS.forEach(function (k) { sum += stats[k]; });
  b.stats = stats; b.sum = sum; b.total = Math.round(sum / 5); b.rank = CB.rankOf(b.total);
  if (isFinite(num(st.hpAdd, NaN))) b.hpAdd = Math.round(num(st.hpAdd));
  if (isFinite(num(st.hp, NaN))) b.kabu.hp = Math.round(num(st.hp));
  if (st.rare != null) b.kabu.rare = num(st.rare);
  if (st.rareRank) b.kabu.rareRank = String(st.rareRank);
  if (Array.isArray(st.traitKeys) && st.traitKeys.length) {
    b.kabu.traitKeys = st.traitKeys.slice(0, 2);
    b.kabu.traitNotes = b.kabu.traitKeys.map(function (k) { return { key: k, why: "" }; });
    var t = null;
    CB.TRAITS.forEach(function (x) { if (x.key === b.kabu.traitKeys[0]) t = x; });
    if (t) b.trait = t;
  }
  // 焼き込みがある日は provisional もデータ層の言うとおりにする（真のときだけ立っている）
  b.kabu.provisional = !!st.provisional;
  b.kabu.baked = true;
  return b;
}

/** 素体（その日の決算・株価から。状態係数は乗せない） */
function baseOf(code, day) {
  var d = day || D.latest;
  var u = stockOf(code), st = stateOf(code, d);
  if (!u || !st) return null;
  // fin は渡さない。決算からの計算はデータ層（latest.json への焼き込み）が持つ。
  // 焼き込みが無ければ「株価と出来高だけの暫定素体」になる（設計書 §12 の最終行）。
  var b = KB.buildFromStock({
    code: code, u: u, fin: null, state: st, moves: D.moves,
    date: d.date, mcapTop10: !!top10[code]
  });
  return bakeOver(b, st);
}

/** 今日のその銘柄（素体 × 状態係数）。予想の当たり外れも効かせる */
function todayOf(code, day, extra) {
  var d = day || D.latest;
  var base = baseOf(code, d);
  if (!base) return null;
  var ex = extra || {};
  var st = stateOf(code, d);
  ex.streak = num(store.streak[code]);
  // 決算発表日（データ層が焼き込む）。必殺技の解放条件 earnings（設計書 §6.4）につながります
  if (st && st.earnings) ex.earnings = true;
  var mods = KB.stateMods(st, d.market, ex);
  var b = KB.applyMods(base, mods);
  // 必殺技は解放された日だけ技に入る（技だけ組み直す）
  if (mods.unlocked && Object.keys(mods.unlocked).length) {
    var withUlt = KB.buildFromStock({
      code: code, u: stockOf(code), fin: null, state: stateOf(code, d),
      moves: D.moves, date: d.date, unlocked: mods.unlocked, mcapTop10: !!top10[code]
    });
    b.moves = withUlt.moves;
  }
  return b;
}

/**
 * 一覧・図鑑の 1 行ぶんの軽い情報。3,500 銘柄を並べるので、
 * 表と札の描画では個体（技まで組む）を作らない。
 */
function lightOf(code, day) {
  var d = day || D.latest;
  var u = stockOf(code), st = stateOf(code, d);
  if (!u) return null;
  var elem = elemOfCode(code);
  return {
    code: code, u: u, st: st, elem: elem, element: CB.ELEMENTS[elem],
    hash: KB.dayHash(code, d.date),
    rare: st && st.rare != null ? num(st.rare) : 0.35,
    rareRank: st && st.rareRank ? String(st.rareRank) : "C"
  };
}

// ══════════════ 手続き生成のアバター（設計書 §10）══════════════
// 画像は用意していないので、属性色とコードのハッシュだけで顔を描く。外部素材ゼロ・決定論。
var EL_COLOR = ["#a6e3a1", "#fab387", "#f9e2af", "#a6adc8", "#89dceb"];
function avatarSvg(beast, size, gone) {
  var h = beast.hash >>> 0, e = beast.elem, col = EL_COLOR[e], s = size || 44;
  var eyes = 1 + (h & 1) + ((h >> 7) & 1);           // 1〜3 個
  var mouth = (h >> 3) % 3;
  var tilt = ((h >> 11) % 21) - 10;
  var g = "";
  // 属性ごとの飾り（木=若葉 / 火=炎 / 土=岩 / 金=刃 / 水=しずく）
  if (e === 0) g = '<path d="M32 9 Q38 2 44 8 Q38 14 32 9Z" fill="' + col + '"/>';
  else if (e === 1) g = '<path d="M32 4 L38 14 L26 14Z" fill="' + col + '"/>';
  else if (e === 2) g = '<rect x="24" y="6" width="16" height="8" rx="2" fill="' + col + '"/>';
  else if (e === 3) g = '<path d="M32 3 L36 15 L28 15Z" fill="' + col + '"/>';
  else g = '<path d="M32 4 Q38 12 32 16 Q26 12 32 4Z" fill="' + col + '"/>';
  var ex = [];
  for (var i = 0; i < eyes; i++) {
    var x = 32 + (i - (eyes - 1) / 2) * 11;
    ex.push('<circle cx="' + x + '" cy="34" r="4" fill="#11111b"/>' +
            '<circle cx="' + (x + ((h >> (i + 2)) & 1 ? 1.3 : -1.3)) + '" cy="33" r="1.5" fill="#fff"/>');
  }
  var mo = mouth === 0 ? '<path d="M26 46 Q32 51 38 46" stroke="#11111b" stroke-width="2.4" fill="none" stroke-linecap="round"/>'
    : mouth === 1 ? '<rect x="27" y="45" width="10" height="3" rx="1.5" fill="#11111b"/>'
      : '<path d="M26 48 Q32 43 38 48" stroke="#11111b" stroke-width="2.4" fill="none" stroke-linecap="round"/>';
  return '<svg class="avatar' + (s > 50 ? " lg" : "") + (gone ? " gone" : "") +
    '" viewBox="0 0 64 64" width="' + s + '" height="' + s + '" aria-hidden="true">' +
    '<g transform="rotate(' + tilt + ' 32 36)">' + g +
    '<circle cx="32" cy="38" r="21" fill="' + col + '" opacity=".9"/>' +
    ex.join("") + mo + '</g></svg>';
}

function daysBehind() {

  while (d < now) {
    d = new Date(d.getTime() + 86400000);
    var w = d.getUTCDay();
    if (w !== 0 && w !== 6) n++;

  return Math.max(0, n - 1);
}

// ══════════════ 営業日の並び（index.json）══════════════
// 別のワークフローが kabu/data/index.json を書く:
//   { schemaVersion, updatedAt, latest, days:[...], archived:[...] }
// days は daily/<date>.json が実在する日付の昇順。無くても動く（latest.json の 1 日だけになる）。
function tradingDays() {
  var days = [];
  if (D.index && Array.isArray(D.index.days)) {
    days = D.index.days.filter(function (d) { return typeof d === "string" && /^\d{4}-\d{2}-\d{2}$/.test(d); });
  }
  if (days.indexOf(D.latest.date) < 0) days.push(D.latest.date);
  days.sort();
  // latest より先の日付は精算しない（その日の状態がまだ無い）
  return days.filter(function (d) { return d <= D.latest.date; });
}

function pendingDays() {
  return tradingDays().filter(function (d) { return !store.settledTo || d > store.settledTo; });
}

/**
 * 日次スナップショットを 1 日ぶん読む。
 * index.json の dailyExt が ".json.gz" なら中身は gzip なので、その場で展開する
 * （配信元が先に展開して返してくる場合もあるので、gzip の目印を見てから決めます）。
 */
function loadDaily(date) {
  var ext = (D.index && typeof D.index.dailyExt === "string" && D.index.dailyExt) ? D.index.dailyExt : ".json";
  var url = "kabu/data/daily/" + date + ext;
  return fetch(url, { cache: "no-cache" }).then(function (r) {
    if (!r.ok) throw new Error(url + " が読めません（" + r.status + "）");
    return r.arrayBuffer();
  }).then(function (buf) {
    var u8 = new Uint8Array(buf);
    if (u8.length > 2 && u8[0] === 0x1f && u8[1] === 0x8b) {          // gzip の目印
      if (typeof DecompressionStream === "undefined") throw new Error("この端末では gzip を展開できません");
      return new Response(new Blob([u8]).stream().pipeThrough(new DecompressionStream("gzip"))).text()
        .then(function (t) { return JSON.parse(t); });
    }
    return JSON.parse(new TextDecoder("utf-8").decode(u8));
  });
}

/** 精算に必要な日をまとめて読む。読めない日は入れない（飛ばす） */
function loadDays(days) {
  return Promise.all(days.map(function (date) {
    if (date === D.latest.date) { D.daily[date] = D.latest; return null; }
    if (D.daily[date]) return null;
    return loadDaily(date).then(function (j) {
      if (j && j.stocks && j.date) D.daily[date] = j;
    }).catch(function () { /* 読めない日は飛ばす */ });
  }));
}

function seasonIdOf(date) { return String(date || "").slice(0, 7); }

/** 勝ち点＋予想的中で順位帯（設計書 §7.5）。帯は月内の積み上げで上がっていきます */
function seasonBand(se) {
  var p = num(se.points) + num(se.hits);
  if (p >= 60) return { rank: "S", name: "S 帯（相場の主）" };
  if (p >= 40) return { rank: "A", name: "A 帯（一軍）" };
  if (p >= 24) return { rank: "B", name: "B 帯（中堅）" };
  if (p >= 12) return { rank: "C", name: "C 帯（見習い）" };
  return { rank: "D", name: "D 帯（新入り）" };
}

function heldValue() {
  var v = 0;
  Object.keys(store.holdings).forEach(function (c) {
    var st = stateOf(c), hd = store.holdings[c];
    var price = st ? num(st.close) : num(hd.last, hd.cost);
    v += price * num(hd.units);
  });
  return v;
}

function hasTitle(key) {
  return store.titles.some(function (t) { return t.key === key; });
}

/** 条件を満たした称号をその場で与える（永続）。何を得たかは精算の結果に出します */
function awardTitles(date, notes) {
  var ctx = {
    assets: store.cash + heldValue(),
    hasLoss: Object.keys(store.holdings).some(function (c) {
      var st = stateOf(c);
      return st && num(st.close) < num(store.holdings[c].cost);
    })
  };
  TITLES.forEach(function (t) {
    if (hasTitle(t.key)) return;
    var ok = false;
    try { ok = !!t.test(store.season, ctx); } catch (e) { ok = false; }
    if (!ok) return;
    store.titles.push({ key: t.key, name: t.name, aspect: t.aspect, why: t.why, season: store.season.id, date: date });
    notes.push({ kind: "title", text: "称号「" + t.name + "」を獲得しました（" + t.why + "）。" });
  });
}

/** シーズンが変わったので、いまの成績を過去ぶんとして残す（軽量） */
function closeSeason(notes) {
  var se = store.season;
  if (!se.id || !se.days) return;
  var band = seasonBand(se);
  store.seasons.push({
    id: se.id, days: se.days, wins: se.wins, losses: se.losses, draws: se.draws,
    points: se.points, hits: se.hits, misses: se.misses, gain: Math.round(se.gain),
    band: band.rank,
    titles: store.titles.filter(function (t) { return t.season === se.id; }).map(function (t) { return t.name; })
  });
  store.seasons = store.seasons.slice(-36);
  notes.push({
    kind: "season",
    text: se.id + " のシーズンが終わりました。" + band.name + "（勝ち点 " + se.points +
      "・予想的中 " + se.hits + "・" + se.days + " 日）。"
  });
}

function computeIdxOptions() {
  var seen = Object.create(null);
  var stocks = D.universe.stocks || {};
  for (var c in stocks) {

    if (Array.isArray(u.indices)) u.indices.forEach(function (k) { seen[k] = true; });

    elemCache[c] = typeof u.elem === "number" ? ((u.elem % 5) + 5) % 5 : KB.sectorElem(u.sector33);
  }
  idxOptions = Object.keys(seen).sort();
}

/** 検索と絞り込みを通した銘柄コード（並べ替え前） */
function filteredCodes(q) {
  var stocks = D.universe.stocks || {};
  var needle = String(q.q || "").trim().toLowerCase();
  var out = [];
  for (var c in stocks) {
    var u = stocks[c];
    if (!u.listed) continue;               // 上場廃止は一覧に出さない（図鑑の「旅立ち」で見られます）
    var st = stateOf(c);
    if (!st) continue;
    if (q.held && !store.holdings[c]) continue;
    if (needle) {
      var hay = (c + " " + (u.name || "") + " " + (u.short || "")).toLowerCase();
      if (hay.indexOf(needle) < 0) continue;
    }
    if (q.elem !== "" && String(elemOfCode(c)) !== String(q.elem)) continue;
    if (q.idx && !(Array.isArray(u.indices) && u.indices.indexOf(q.idx) >= 0)) continue;
    if (q.rare && (st.rareRank ? String(st.rareRank) : "C") !== q.rare) continue;
    // 決算がまだ取れていない銘柄は暫定素体（レア度 C）で、見た目がそろってしまうので分けられるようにする
    if (q.fin === "yes" && st.provisional) continue;
    if (q.fin === "no" && !st.provisional) continue;
    out.push(c);
  }
  return out;
}

function elemOfCode(code) {
  if (elemCache[code] != null) return elemCache[code];
  var u = stockOf(code);
  if (!u) return 4;
  elemCache[code] = typeof u.elem === "number" ? ((u.elem % 5) + 5) % 5 : KB.sectorElem(u.sector33);
  return elemCache[code];
}

function filterBar(prefix, q, withRare) {
  var h = [];
  h.push('<div class="row small" style="margin-top:8px">');
  h.push('<input type="search" id="' + prefix + '-q" placeholder="社名か証券コードで探す" value="' + esc(q.q) + '">');
  h.push('<select id="' + prefix + '-elem"><option value="">属性すべて</option>' +
    CB.ELEMENTS.map(function (e, i) {
      return '<option value="' + i + '"' + (String(q.elem) === String(i) ? " selected" : "") + '>' + esc(e.name) + '</option>';
    }).join("") + '</select>');
  if (withRare) {
    h.push('<select id="' + prefix + '-rare"><option value="">レアすべて</option>' +
      RARE_ORDER.map(function (r) {
        return '<option value="' + r + '"' + (q.rare === r ? " selected" : "") + '>' + r + '</option>';
      }).join("") + '</select>');
    if (idxOptions.length) {
      h.push('<select id="' + prefix + '-idx"><option value="">規模すべて</option>' +
        idxOptions.map(function (k) {
          return '<option value="' + esc(k) + '"' + (q.idx === k ? " selected" : "") + '>' + esc(INDEX_LABEL[k] || k) + '</option>';
        }).join("") + '</select>');
    }
    h.push('<select id="' + prefix + '-fin"><option value="">決算の有無を問わない</option>' +
      '<option value="yes"' + (q.fin === "yes" ? " selected" : "") + '>決算あり</option>' +
      '<option value="no"' + (q.fin === "no" ? " selected" : "") + '>決算まち（暫定素体）</option></select>');
  }
  h.push('<label class="chk"><input type="checkbox" id="' + prefix + '-held"' + (q.held ? " checked" : "") + '>契約中のみ</label>');
  h.push('</div>');
  return h.join("");
}

function viewMarket() {
  var codes = filteredCodes(marketQ);
  // 表には顔を出さないので、個体（技まで組む）は作らない。必要な数字だけ集める。
  var rows = codes.map(function (c) {
    var u = stockOf(c), st = stateOf(c), hold = store.holdings[c];
    return {
      code: c, name: u.short || u.name, elem: elemOfCode(c),
      rareRank: st.rareRank ? String(st.rareRank) : "C", rare: num(st.rare, 0.35),
      close: num(st.close), chg1: num(st.chg1), chgYtd: num(st.chgYtd), mcap: num(st.mcap),
      units: hold ? hold.units : 0
    };
  });
  rows.sort(function (a, b) {
    var k = marketSort.key, d = marketSort.desc ? -1 : 1;
    if (k === "name") return (a.name < b.name ? -1 : 1) * d * -1;
    if (k === "rare") return (a.rare - b.rare) * d || (a.code < b.code ? -1 : 1);
    return (num(a[k]) - num(b[k])) * d || (a.code < b.code ? -1 : 1);
  });
  var shown = rows.slice(0, marketQ.limit);

  var h = [];
  h.push('<div class="card"><div class="spread"><h2>市場</h2>' +
    '<span class="muted small">契約金 = その日の終値。手放すと当日終値で戻ります（手数料なし）</span></div>');
  h.push(filterBar("mkt", marketQ, true));
  h.push('<div class="muted small" style="margin-top:6px">' + rows.length + ' 銘柄のうち ' + shown.length + ' 件を表示しています。</div>');
  h.push('<div class="scroll" style="margin-top:8px"><table><thead><tr>' +
    th("name", "銘柄") + '<th>属性</th>' + th("rare", "レア") + th("close", "株価") +
    th("chg1", "前日比") + th("chgYtd", "年初来", true) + th("mcap", "時価総額", true) +
    '<th>口数</th><th></th></tr></thead><tbody>');
  shown.forEach(function (r) {
    h.push('<tr><td><a href="#" data-code="' + r.code + '">' + esc(r.name) + '</a> <span class="faint small">' + esc(r.code) + '</span></td>' +
      '<td><span class="' + elClass(r.elem) + '">' + CB.ELEMENTS[r.elem].name + '</span></td>' +
      '<td class="rare">' + esc(r.rareRank) + '</td>' +
      '<td class="num">' + yen(r.close) + '</td>' +
      '<td class="num ' + cls(r.chg1) + '">' + pct(r.chg1) + '</td>' +
      '<td class="num hide-s ' + cls(r.chgYtd) + '">' + pct(r.chgYtd, 1) + '</td>' +
      '<td class="num hide-s">' + (r.mcap ? (r.mcap / 1e12).toFixed(2) + '兆' : '—') + '</td>' +
      '<td class="num">' + (r.units ? units(r.units) : "") + '</td>' +
      '<td><button class="sm" data-buy="' + r.code + '" ' + (store.cash < r.close ? "disabled" : "") + '>契約</button>' +
      (r.units ? ' <button class="sm" data-sell="' + r.code + '">手放す</button>' : '') + '</td></tr>');
  });
  if (!shown.length) h.push('<tr><td colspan="9" class="faint">見つかりませんでした。条件をゆるめてください。</td></tr>');
  h.push('</tbody></table></div>');
  if (rows.length > shown.length) {
    h.push('<div class="row" style="margin-top:8px"><button class="sm" data-more="market">もっと見る（残り ' +
      (rows.length - shown.length) + ' 件）</button></div>');
  }
  h.push('</div>');

  // 保有
  var held = Object.keys(store.holdings);
  h.push('<div class="card"><h2>契約中</h2>');
  if (!held.length) h.push('<div class="empty">まだ誰とも契約していません。</div>');
  else {
    var sum = 0, cost = 0;
    h.push('<div class="scroll"><table><thead><tr><th>銘柄</th><th>口数</th><th>取得</th><th>現在</th><th>損益</th></tr></thead><tbody>');
    held.forEach(function (c) {
      var hd = store.holdings[c], st = stateOf(c), u = stockOf(c);
      if (!st || !u) return;
      var now = num(st.close) * hd.units, cst = hd.cost * hd.units, pl = now - cst;
      sum += now; cost += cst;
      h.push('<tr><td><a href="#" data-code="' + c + '">' + esc(u.short) + '</a></td>' +
        '<td class="num">' + units(hd.units) + '</td><td class="num">' + yen(hd.cost) + '</td>' +
        '<td class="num">' + yen(st.close) + '</td>' +
        '<td class="num ' + cls(pl) + '">' + (pl >= 0 ? "+" : "") + yen(pl) + '</td></tr>');
    });
    h.push('</tbody></table></div>');
    h.push('<div class="row small muted" style="margin-top:8px"><span>評価額 <b class="num">' + yen(sum) + '</b> 円</span>' +
      '<span>損益 <b class="num ' + cls(sum - cost) + '">' + (sum - cost >= 0 ? "+" : "") + yen(sum - cost) + '</b> 円</span>' +
      '<span>資金と合わせて <b class="num">' + yen(sum + store.cash) + '</b> 円</span></div>');
  }
  h.push('</div>');
  return h.join("");
}

function th(key, label, hideS) {
  var mark = marketSort.key === key ? (marketSort.desc ? " ↓" : " ↑") : "";
  return '<th data-sort="' + key + '" class="' + (hideS ? "hide-s" : "") + '">' + esc(label) + mark + '</th>';
}

function viewParty() {

      var b = todayOf(code);
      h.push('<div class="slot filled">' + avatarSvg(b) +

  }

      var b = todayOf(c), inParty = store.party.indexOf(c) >= 0;
      h.push('<div class="slot filled">' + avatarSvg(b) +
        '<div style="min-width:0;flex:1"><div><b>' + esc(stockOf(c).short) + '</b> <span class="' + elClass(b.elem) + '">' + b.element.name + '</span> <span class="rare">' + b.kabu.rareRank + '</span></div>' +
        '<div class="small muted">' + b.trait.name + ' ／ ' + units(store.holdings[c].units) + ' 口</div></div>' +
        (inParty ? '<span class="tag">編成中</span>' : '<button class="sm" data-slotin="' + c + '">入れる</button>') + '</div>');
    });
    h.push('</div>');
  }
  h.push('</div>');

function partyReady() {
  return store.party.filter(function (c) { return c && stockOf(c) && stateOf(c); }).length;
}

}

var dlgCode = "";

function showStock(code) {
  var u = stockOf(code), st = stateOf(code), base = baseOf(code), today = todayOf(code);
  if (!u || !st || !base) return;
  dlgCode = code;
  var h = [];
  h.push('<div class="row">' + avatarSvg(base, 72) +

  CB.STAT_KEYS.forEach(function (k) {

    h.push('<div class="stat"><span>' + LBL[k] + '</span><div class="bar"><i style="width:' + v + '%"></i></div>' +

  });

    base.kabu.traitNotes.map(function (n) {
      var t = CB.TRAITS.filter(function (x) { return x.key === n.key; })[0];
      return '<span class="tag on">' + esc(t ? t.name : n.key) + '</span>' + (n.why ? '<span class="faint">' + esc(n.why) + '</span>' : "");
    }).join(" ") + '</div>');

  h.push('<div class="row small">' +
    '<span>終値 <b class="num">' + yen(st.close) + '</b> 円</span>' +

    '<span>年初来 <span class="' + cls(st.chgYtd) + '">' + pct(st.chgYtd, 1) + '</span>（レンジ位置 ' + Math.round(num(st.ytdPos) * 100) + '%）</span>' +
    '<span>出来高比 ' + num(st.volRatio).toFixed(2) + '</span>' +
    '<span>25 日線乖離 ' + pct(st.dev25, 1) + '</span>' +
    (st.per ? '<span>PER ' + st.per + '</span>' : "") + (st.pbr ? '<span>PBR ' + st.pbr + '</span>' : "") +
    '</div>');
