<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>株バトル</title>
<meta name="description" content="日本株を決算・株価・事業からキャラクターにして戦わせるゲーム。">
<style>
:root{
  --bg:#1e1e2e; --bg2:#181825; --panel:#313244; --line:#45475a;
  --fg:#cdd6f4; --dim:#9399b2; --faint:#6c7086;
  --up:#a6e3a1; --down:#f38ba8; --accent:#89b4fa; --warn:#f9e2af;
  --wood:#a6e3a1; --fire:#fab387; --earth:#f9e2af; --metal:#a6adc8; --water:#89dceb;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);
  font:14px/1.7 -apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  -webkit-text-size-adjust:100%}
a{color:var(--accent)}
button{font:inherit;color:inherit;background:var(--panel);border:1px solid var(--line);
  border-radius:8px;padding:.45em .9em;cursor:pointer}
button:hover:not(:disabled){background:var(--line)}
button:disabled{opacity:.4;cursor:default}
button.primary{background:var(--accent);color:#11111b;border-color:var(--accent);font-weight:700}
button.sm{padding:.25em .6em;font-size:12px}
/* 検索・絞り込みの部品。狭い画面でも横に溢れないよう min-width:0 を効かせる */
input,select{font:inherit;color:inherit;background:var(--panel);border:1px solid var(--line);
  border-radius:8px;padding:.35em .6em;min-width:0;max-width:100%}
input[type="search"]{flex:1 1 150px}
input[type="checkbox"]{width:1em;height:1em;flex:none;accent-color:var(--accent)}
label.chk{display:inline-flex;gap:4px;align-items:center;font-size:12px;color:var(--dim);white-space:nowrap}
h1,h2,h3{line-height:1.35;margin:0}
table{border-collapse:collapse;width:100%}
th,td{padding:.4em .5em;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{color:var(--dim);font-weight:600;font-size:12px;cursor:pointer;position:sticky;top:0;background:var(--bg2);z-index:1}
.wrap{max-width:1000px;margin:0 auto;padding:0 16px}
.pad{padding-block:16px}

/* ── 見出し ── */
header{background:var(--bg2);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.hrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:10px}
.brand{font-weight:800;letter-spacing:.06em;font-size:16px}
.mkt{font-size:12px;color:var(--dim);display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.cash{margin-left:auto;font-variant-numeric:tabular-nums;font-weight:700}
nav{display:flex;gap:4px;overflow-x:auto;padding-bottom:8px}
nav button{border-radius:999px;white-space:nowrap}
nav button[aria-current="true"]{background:var(--accent);color:#11111b;border-color:var(--accent);font-weight:700}

/* ── 部品 ── */
.card{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(270px,1fr))}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.muted{color:var(--dim)}.faint{color:var(--faint)}
.small{font-size:12px}
.num{font-variant-numeric:tabular-nums}
.up{color:var(--up)}.down{color:var(--down)}
.tag{display:inline-block;font-size:11px;padding:.1em .55em;border-radius:999px;
  border:1px solid var(--line);background:var(--panel);color:var(--dim);white-space:nowrap}
.tag.on{background:var(--warn);color:#11111b;border-color:var(--warn);font-weight:700}
.tag.off{opacity:.6}
.el{display:inline-grid;place-items:center;width:1.7em;height:1.7em;border-radius:6px;
  font-weight:800;color:#11111b;font-size:12px}
.el0{background:var(--wood)}.el1{background:var(--fire)}.el2{background:var(--earth)}
.el3{background:var(--metal)}.el4{background:var(--water)}
.rare{font-weight:800;letter-spacing:.04em}
.bar{height:6px;border-radius:3px;background:var(--panel);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent)}
/* 3 列目は「100 +6」まで折り返さない幅にする（増減が次の行に落ちると行が二重に見える） */
.stat{display:grid;grid-template-columns:2.2em 1fr 4.6em;gap:6px;align-items:center;font-size:12px}
.stat>span:last-child{white-space:nowrap;text-align:right}
.hp{display:grid;grid-template-columns:1fr;gap:2px}
.avatar{width:44px;height:44px;flex:none}
.avatar.lg{width:72px;height:72px}
/* 旅立ち（上場廃止）のアバターは灰色にする（設計書 §8.4） */
.gone{filter:grayscale(1);opacity:.55}
.empty{color:var(--faint);text-align:center;padding:2.5em 1em}
.scroll{max-height:62vh;overflow:auto}
dialog{background:var(--bg2);color:var(--fg);border:1px solid var(--line);border-radius:14px;
  padding:0;max-width:640px;width:calc(100vw - 32px)}
dialog::backdrop{background:#000a}
.dlg-body{padding:16px;max-height:80vh;overflow:auto}
.slot{display:flex;gap:10px;align-items:center;padding:8px;border:1px dashed var(--line);
  border-radius:10px;min-height:62px}
.slot.filled{border-style:solid;background:var(--panel)}
.log{font-size:12px;line-height:1.9;max-height:44vh;overflow:auto;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.log .hit{color:var(--fg)}.log .crit{color:var(--warn);font-weight:700}
.log .note{color:var(--accent)}.log .ko{color:var(--down);font-weight:700}
.log .miss{color:var(--faint)}
.gsep{border-top:1px solid var(--line);margin:.5em 0;padding-top:.4em;color:var(--dim)}
.pill{display:inline-flex;gap:4px;align-items:center}
.notes{margin:8px 0;padding-left:0;list-style:none}
.notes li{padding:.3em 0 .3em .9em;border-left:2px solid var(--accent);margin-bottom:4px;font-size:12px}
details>summary{cursor:pointer;color:var(--dim);font-size:12px}
@media(max-width:560px){
  .wrap{padding:0 12px}
  th,td{padding:.35em .3em;font-size:12px}
  .hide-s{display:none}
}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="hrow">
      <span class="brand">株バトル</span>
      <span class="mkt" id="mkt"></span>
      <span class="cash" id="cash"></span>
    </div>
    <nav id="nav"></nav>
  </div>
</header>

<main class="wrap pad" id="main"><div class="empty">読み込み中…</div></main>

<footer class="wrap pad small faint">
  データ: 株価・決算は Yahoo Finance、銘柄マスタは JPX「東証上場銘柄一覧」。
  対戦エンジンは <a href="https://github.com/ksaga115/BarcodeTool">BarcodeTool</a> のコードバトル（79da6202）。
  ビルド 2026-09-26 ／ 遊びのためのもので、投資判断には使えません。
</footer>

<dialog id="dlg"><div class="dlg-body" id="dlg-body"></div></dialog>

<script>
const CB = (function () {

  // ── 文字列 → UTF-8 バイト列 ──
  function utf8Bytes(s) {
    const out = [];
    for (let i = 0; i < s.length; i++) {
      let c = s.codePointAt(i);
      if (c > 0xFFFF) i++;
      if (c < 0x80) out.push(c);
      else if (c < 0x800) out.push(0xC0 | (c >> 6), 0x80 | (c & 63));
      else if (c < 0x10000) out.push(0xE0 | (c >> 12), 0x80 | ((c >> 6) & 63), 0x80 | (c & 63));
      else out.push(0xF0 | (c >> 18), 0x80 | ((c >> 12) & 63), 0x80 | ((c >> 6) & 63), 0x80 | (c & 63));
    }
    return out;
  }

  // ── 性質の異なる4系統のハッシュ ──
  function fnv1a(b) { let h = 0x811c9dc5; for (let i = 0; i < b.length; i++) { h ^= b[i]; h = Math.imul(h, 0x01000193) >>> 0; } return h >>> 0; }
  function djb2(b) { let h = 5381; for (let i = 0; i < b.length; i++) { h = (Math.imul(h, 33) + b[i]) >>> 0; } return h >>> 0; }
  function sdbm(b) { let h = 0; for (let i = 0; i < b.length; i++) { h = (b[i] + (h << 6) + (h << 16) - h) >>> 0; } return h >>> 0; }
  function murmur3(b, seed) {
    let h = seed >>> 0, k = 0, i = 0;
    const len = b.length, c1 = 0xcc9e2d51, c2 = 0x1b873593;
    for (; i + 4 <= len; i += 4) {
      k = (b[i] | (b[i + 1] << 8) | (b[i + 2] << 16) | (b[i + 3] << 24)) >>> 0;
      k = Math.imul(k, c1) >>> 0; k = ((k << 15) | (k >>> 17)) >>> 0; k = Math.imul(k, c2) >>> 0;
      h = (h ^ k) >>> 0; h = ((h << 13) | (h >>> 19)) >>> 0; h = (Math.imul(h, 5) + 0xe6546b64) >>> 0;
    }
    k = 0;
    switch (len & 3) {
      case 3: k ^= b[i + 2] << 16;
      case 2: k ^= b[i + 1] << 8;
      case 1: k ^= b[i];
        k = Math.imul(k, c1) >>> 0; k = ((k << 15) | (k >>> 17)) >>> 0; k = Math.imul(k, c2) >>> 0;
        h = (h ^ k) >>> 0;
    }
    h = (h ^ len) >>> 0;
    h ^= h >>> 16; h = Math.imul(h, 0x85ebca6b) >>> 0;
    h ^= h >>> 13; h = Math.imul(h, 0xc2b2ae35) >>> 0; h ^= h >>> 16;
    return h >>> 0;
  }

  // ── 決定論的な擬似乱数。種は必ずコード内容から作る（乱数だけでは生成しない）──
  function sm32(a) {
    a = a >>> 0;
    return function () {
      a = (a + 0x9e3779b9) | 0;
      let t = a ^ (a >>> 16); t = Math.imul(t, 0x21f0aaad);
      t = t ^ (t >>> 15); t = Math.imul(t, 0x735a2d97);
      return ((t ^ (t >>> 15)) >>> 0) / 4294967296;
    };
  }

  /** その1ゲームだけの「調子」（0.8〜1.2）。個体の hash と gameSeed だけから決まるので、
   *  A/B どちらの引数で渡しても同じ値になる（ターン内の乱数と違い、ターン数が多くても薄まらない）。
   *  TOTAL の差がわずかでも試合ごとの展開差が大きくなりすぎる問題を、ここで直接抑える。 */
  function conditionRoll(beastHash, gameSeed) {
    const r = sm32(((beastHash >>> 0) ^ Math.imul((gameSeed >>> 0) || 0, 0x2545F491) ^ 0x9E3779B9) >>> 0)();
    return 0.73 + r * 0.54;
  }
  /** 調子（cond）を全ステータスにまとめてかける。攻守速技運のどれか一つではなく全体が
   *  ぶれるようにすることで、TOTAL差で見えている「地力の差」を試合ごとに実際に揺らす。 */
  function applyCondition(f, cond) {
    f.cond = cond;
    f.atk *= cond; f.def *= cond; f.spd *= cond; f.tec *= cond; f.luk *= cond;
  }

  // ── 正規化：同じコードとみなすべき入力を同じ個体にまとめる ──
  function normalize(text) {
    let s = String(text == null ? "" : text);
    s = s.replace(/\r\n?/g, "\n");
    try { s = s.normalize("NFKC"); } catch (e) { /* 未対応環境ではそのまま */ }
    s = s.replace(/^[\s\u0000]+/, "").replace(/[\s\u0000]+$/, "");
    // UPC-A を EAN-13 として読んだ場合（先頭0付き13桁）は12桁に揃える
    if (/^\d{13}$/.test(s) && s.charAt(0) === "0") s = s.slice(1);
    return s;
  }

  // ── コード内容そのものから取り出す構造的な特徴 ──
  function features(s) {
    const cps = [];
    for (let i = 0; i < s.length; i++) { const c = s.codePointAt(i); cps.push(c); if (c > 0xFFFF) i++; }
    const n = cps.length || 1;

    let digits = 0, upper = 0, lower = 0, sym = 0, wide = 0;
    let runMax = 1, run = 1, rises = 0, falls = 0, equals = 0;
    let posw = 0, alt = 0, sqw = 0;
    const seen = Object.create(null);
    const buckets = new Array(16).fill(0);

    for (let i = 0; i < cps.length; i++) {
      const c = cps[i];
      if (c >= 48 && c <= 57) digits++;
      else if (c >= 65 && c <= 90) upper++;
      else if (c >= 97 && c <= 122) lower++;
      else if (c < 128) sym++;
      else wide++;
      seen[c] = (seen[c] || 0) + 1;
      // 位置による重み。周期の違う数を掛けて単調増加にならないようにする
      posw = (posw + Math.imul(c + 1, ((i * i) % 61) + 7)) >>> 0;
      sqw = (sqw + Math.imul((c ^ (i * 31)) >>> 0, (i % 17) + 3)) >>> 0;
      alt = (alt + ((i & 1) ? -c : c) * ((i % 5) + 1)) | 0;
      if (i > 0) {
        const p = cps[i - 1];
        if (c > p) rises++; else if (c < p) falls++; else equals++;
        if (c === p) { run++; if (run > runMax) runMax = run; } else run = 1;
        // 隣り合う文字の関係を16個のバケットに畳み込む
        const bi = (Math.imul(p + 1, 0x9E3779B1) ^ Math.imul(c + 131, 0x85EBCA77)) >>> 0;
        buckets[bi & 15] = (buckets[bi & 15] + (bi >>> 8)) >>> 0;
      }
    }
    let distinct = 0; for (const k in seen) distinct++;

    // 対称性（回文らしさ）
    let symm = 0;
    for (let i = 0, j = cps.length - 1; i < j; i++, j--) if (cps[i] === cps[j]) symm++;

    // チェックディジット的な性質（コード内容だけから判定できるもの）
    const allDigit = /^[0-9]+$/.test(s);
    let eanOk = 0, luhnOk = 0, mod43 = 0;
    if (allDigit && (n === 8 || n === 12 || n === 13 || n === 14)) {
      let sum = 0;
      for (let i = 0; i < n - 1; i++) {
        const d = cps[n - 2 - i] - 48;
        sum += (i % 2 === 0) ? d * 3 : d;
      }
      eanOk = (((10 - (sum % 10)) % 10) === (cps[n - 1] - 48)) ? 1 : 0;
    }
    if (allDigit && n >= 2) {
      let sum = 0, dbl = false;
      for (let i = n - 1; i >= 0; i--) {
        let d = cps[i] - 48;
        if (dbl) { d *= 2; if (d > 9) d -= 9; }
        sum += d; dbl = !dbl;
      }
      luhnOk = (sum % 10 === 0) ? 1 : 0;
    }
    const C39 = "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ-. $/+%";
    let m43 = 0, c39 = 1;
    for (let i = 0; i < s.length; i++) { const p = C39.indexOf(s.charAt(i)); if (p < 0) { c39 = 0; break; } m43 += p; }
    if (c39 && s.length > 1) mod43 = ((m43 % 43) === C39.indexOf(s.charAt(s.length - 1))) ? 1 : 0;

    const foldB = buckets.reduce(function (a, x, i) { return (a ^ Math.imul(x, (0x27220A95 + i * 2654435761) >>> 0)) >>> 0; }, 0x9E3779B9);
    const comp = Math.imul(digits * 37 + upper * 53 + lower * 61 + sym * 71 + wide * 83 + 1, (n % 13) + 1) >>> 0;
    const shape = Math.imul(runMax * 151 + rises * 23 + falls * 29 + equals * 41 + 1, (distinct % 11) + 3) >>> 0;
    const flags = (eanOk * 5 + luhnOk * 3 + mod43 * 7 + (allDigit ? 2 : 0) + (wide ? 11 : 0)) >>> 0;

    return {
      n: n, distinct: distinct, runMax: runMax, symm: symm,
      posw: posw, sqw: sqw, alt: (alt >>> 0), foldB: foldB, comp: comp, shape: shape, flags: flags,
      buckets: buckets
    };
  }

  // ── 属性（陰陽五行・木火土金水）──
  // 相生の順（木→火→土→金→水→木）に並べる。この並び順そのものが相生/相克の計算根拠になる。
  const ELEMENTS = [
    { key: "WOOD", name: "木", mark: "木", color: "#a6e3a1" },
    { key: "FIRE", name: "火", mark: "火", color: "#fab387" },
    { key: "EARTH", name: "土", mark: "土", color: "#f9e2af" },
    { key: "METAL", name: "金", mark: "金", color: "#a6adc8" },
    { key: "WATER", name: "水", mark: "水", color: "#89dceb" }
  ];
  // 相生の並び順に対して、d=1（自分が生む相手）/ d=2（自分が克す相手）/
  // d=3（自分を克す相手）/ d=4（自分を生んだ相手）。克は生より強く効く（倍率は控えめに、
  // 同TOTAL帯で属性だけで決まらない程度）。
  function affinity(a, b) {
    const d = ((b - a) % 5 + 5) % 5;
    if (d === 1) return 1.05;   // 相生（生む）
    if (d === 2) return 1.13;   // 相克（克す）
    if (d === 3) return 0.89;   // 被克（克される）
    if (d === 4) return 0.95;   // 被生（生まれ元）
    return 1.00;
  }

  /** コード内容から読み取れる「系統」→ 属性の傾向（0..4 = 木火土金水）。手がかりが弱ければ -1 */
  function familyElem(s) {
    const d = String(s || "").replace(/[-\s]/g, "");
    if (/^97[89]\d{10}$/.test(d)) return 4;                 // ISBN 書籍 → 水
    if (/^https?:\/\//i.test(s)) return 3;                  // URL → 金
    if (/^(WIFI|MECARD|MATMSG|BEGIN:VCARD|GEO:|TEL:|MAILTO:|SMSTO):/i.test(s)) return 3; // 構造化 → 金
    if (/^\d{8}$/.test(d) || /^\d{12,14}$/.test(d)) {       // JAN/EAN/UPC/ITF: 先頭2桁の帯
      const p = +d.slice(0, 2);
      if (p >= 45 && p <= 49) return 0;                     // 日本 → 木
      if (p <= 13) return 1;                                // 北米 → 火
      if (p >= 30 && p <= 37) return 3;                     // 仏 → 金
      if (p >= 40 && p <= 44) return 0;                     // 独 → 木
      return 2;                                             // その他 → 土
    }
    if (/^\d+$/.test(d) && d.length >= 4) return 2;         // 純数字 → 土
    if (s.length <= 18 && /^[A-Z0-9\-. $/+%*]+$/.test(s) && /[A-Z]/.test(s)) return 0; // Code39系 → 木
    return -1;                                              // 一般テキスト等
  }

  // ── 気質（ステータスの偏り。合計はほぼ0でTOTALを歪ませない）──
  const TEMPERS = [
    { name: "猛攻", off: [14, -10, 3, -4, -3] },
    { name: "堅牢", off: [-9, 15, -6, 2, -2] },
    { name: "疾風", off: [2, -8, 15, -6, -3] },
    { name: "精密", off: [-7, -2, -3, 15, -3] },
    { name: "強運", off: [-5, -4, -3, -4, 16] },
    { name: "均衡", off: [2, 1, 0, 1, -4] },
    { name: "狂戦", off: [18, -13, 6, -8, -3] },
    { name: "要塞", off: [-12, 18, -9, 4, -1] },
    { name: "閃光", off: [5, -9, 18, -9, -5] },
    { name: "策謀", off: [-9, 3, -5, 17, -6] },
    { name: "混沌", off: [8, -6, -8, -6, 12] },
    { name: "老練", off: [-3, 8, -7, 9, -7] },
    { name: "野性", off: [11, -4, 9, -12, -4] },
    { name: "静寂", off: [-8, 10, -8, 8, -2] },
    { name: "苛烈", off: [13, -5, -8, 4, -4] },
    { name: "遊撃", off: [-4, -7, 13, -3, 1] }
  ];

  // ── 特性（TOTALだけで勝敗が決まらない主因）──
  const TRAITS = [
    { key: "fang", name: "猛牙", desc: "与えるダメージが12%上がる" },
    { key: "wall", name: "城壁", desc: "受けるダメージを12%減らす" },
    { key: "swift", name: "韋駄天", desc: "初手を取りやすく、行動順が上がる" },
    { key: "calc", name: "演算", desc: "相手の防御を大きく無視する" },
    { key: "luck", name: "天佑", desc: "会心の発生率が大きく上がる" },
    { key: "wrath", name: "逆鱗", desc: "HPが減るほど攻撃が鋭くなる" },
    { key: "twin", name: "連撃", desc: "ときどき2回続けて攻撃する" },
    { key: "curse", name: "呪詛", desc: "ターン経過で相手の防御を削る" },
    { key: "regen", name: "再生", desc: "毎ターン少しHPが回復する" },
    { key: "crush", name: "重撃", desc: "威力が上がるが行動が遅くなる" },
    { key: "reflect", name: "反射", desc: "受けたダメージの一部を返す" },
    { key: "serene", name: "明鏡", desc: "相手の会心を抑え、回避が上がる" },

    const rest = code.slice(FUSION_CODE_PREFIX.length);

    const len = parseInt(m[1], 10);
    const after = rest.slice(m[0].length);
    if (!(len >= 0) || after.length < len + 1 || after.charAt(len) !== ":") return null;
    const a = after.slice(0, len), b = after.slice(len + 1);
